  /* Filter responses to current year */
  const yearResps = RESPONS.filter(r => r.masa.slice(0, 4) === currentYear);

  /* ── Form link box ── */
  const linkBox = document.createElement('div');
  linkBox.className = 'form-link-box';
  const linkLabel = document.createElement('span');
  linkLabel.className = 'text-sm font-bold';
  linkLabel.textContent = 'Buka borang refleksi:';
  const linkA = document.createElement('a');
  linkA.href = FORM_URL;
  linkA.target = '_blank';
  linkA.rel = 'noopener noreferrer';
  linkA.className = 'form-link-url';
  linkA.textContent = FORM_URL;
  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-btn';
  copyBtn.textContent = 'Salin pautan';
  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(FORM_URL).then(() => {
      copyBtn.textContent = 'Disalin!';
      copyBtn.classList.add('copied');
      setTimeout(() => { copyBtn.textContent = 'Salin pautan'; copyBtn.classList.remove('copied'); }, 2000);
    }).catch(() => {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = FORM_URL;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      copyBtn.textContent = 'Disalin!';
      copyBtn.classList.add('copied');
      setTimeout(() => { copyBtn.textContent = 'Salin pautan'; copyBtn.classList.remove('copied'); }, 2000);
    });
  });
  linkBox.appendChild(linkLabel);
  linkBox.appendChild(linkA);
  linkBox.appendChild(copyBtn);
  container.appendChild(linkBox);

  /* No data for this year */
  if (yearResps.length === 0) {
    const msg = document.createElement('div');
    msg.className = 'placeholder';
    msg.style.paddingTop = '40px';
    const h = document.createElement('h2');
    h.textContent = 'Tiada respons untuk ' + currentYear;
    const p = document.createElement('p');
    p.textContent = 'Semua 66 respons adalah dari tahun 2026.';
    msg.appendChild(h);
    msg.appendChild(p);
    container.appendChild(msg);
    return;
  }

  /* ── Compute stats ── */
  const allScores = yearResps.flatMap(r => r.jawapan);
  const overallMean = mean(allScores);

  const ratings = yearResps.map(r => r.rating).filter(r => r !== null);
  const meanRating = mean(ratings);

  const courses = [...new Set(yearResps.map(r => r.kursus))];
  const programmes = [...new Set(yearResps.map(r => r.program))];

  // Group means
  const groupMeans = STATEMENT_GROUPS.map(g => {
    const vals = yearResps.flatMap(r => r.jawapan.slice(g.start, g.end));
    return { ...g, mean: mean(vals) };
  });

  // Statement means
  const stmtMeans = STATEMENT_LABELS.map((lbl, i) => ({
    label: lbl,
    mean: mean(yearResps.map(r => r.jawapan[i]))
  }));

  // Rating distribution
  const ratingDist = [1,2,3,4,5].map(v => ({ v, count: ratings.filter(r => r === v).length }));

  /* ── Stat tiles ── */
  const statRow = document.createElement('div');
  statRow.className = 'stat-row';
  [
    { val: yearResps.length, lbl: 'Respons' },
    { val: fmt2(overallMean), lbl: 'Min keseluruhan' },
    { val: fmt2(meanRating), lbl: 'Min penilaian' },
    { val: courses.length, lbl: 'Kursus' },
    { val: programmes.length, lbl: 'Program' },
  ].forEach(s => {
    const tile = document.createElement('div');
    tile.className = 'stat-tile';
    const v = document.createElement('div');
    v.className = 'stat-tile-val';
    v.textContent = s.val;
    const l = document.createElement('div');
    l.className = 'stat-tile-lbl';
    l.textContent = s.lbl;
    tile.appendChild(v);
    tile.appendChild(l);
    statRow.appendChild(tile);
  });
  container.appendChild(statRow);

  /* ── Course filter ── */
  let activeCourse = 'all';
  const filterSection = document.createElement('div');
  filterSection.className = 'card mb-16';
  const filterBody = document.createElement('div');
  filterBody.className = 'card-body';
  const filterTitle = document.createElement('div');
  filterTitle.className = 'section-title mb-8';
  filterTitle.textContent = 'Tapis mengikut kursus';
  filterBody.appendChild(filterTitle);
  const filterRow = document.createElement('div');
  filterRow.className = 'course-filter-row';

  function rebuildStats(filtered) {
    // update everything that depends on filtered
    updateGroupMeansSection(filtered);
    updateStmtMeansSection(filtered);
    updateOpenAnswers(filtered);
    updateCourseTable(filtered);
    updateProgrammeTable(filtered);
  }

  function makeFilterBtn(label, value) {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (value === activeCourse ? ' active' : '');
    btn.textContent = label;
    btn.addEventListener('click', () => {
      activeCourse = value;
      filterRow.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filtered = value === 'all' ? yearResps : yearResps.filter(r => r.kursus === value);
      rebuildStats(filtered);
    });
    return btn;
  }

  filterRow.appendChild(makeFilterBtn('Semua', 'all'));
  courses.forEach(c => filterRow.appendChild(makeFilterBtn(c, c)));
  filterBody.appendChild(filterRow);
  filterSection.appendChild(filterBody);
  container.appendChild(filterSection);

  /* ── Two col: Group means + Rating distribution ── */
  const twoCol = document.createElement('div');
  twoCol.className = 'two-col-stats';

  // Group means card
  const groupCard = document.createElement('div');
  groupCard.className = 'card';
  const groupBody = document.createElement('div');
  groupBody.className = 'card-body';
  const groupTitle = document.createElement('div');
  groupTitle.className = 'section-title mb-8';
  groupTitle.textContent = 'Min mengikut kumpulan';
  groupBody.appendChild(groupTitle);
  const groupTableWrap = document.createElement('div');
  groupTableWrap.id = 'group-means-table';
  groupBody.appendChild(groupTableWrap);
  groupCard.appendChild(groupBody);

  // Rating distribution card
  const ratingCard = document.createElement('div');
  ratingCard.className = 'card';
  const ratingBody = document.createElement('div');
  ratingBody.className = 'card-body';
  const ratingTitle = document.createElement('div');
  ratingTitle.className = 'section-title mb-8';
  ratingTitle.textContent = 'Taburan penilaian pelajar';
  ratingBody.appendChild(ratingTitle);
  const ratingBarsWrap = document.createElement('div');
  ratingBarsWrap.id = 'rating-dist-bars';
  ratingBody.appendChild(ratingBarsWrap);
  const ratingNote = document.createElement('div');
  ratingNote.className = 'text-xs text-muted mt-8';
  ratingNote.textContent = `${ratings.length} daripada ${yearResps.length} respons ada penilaian.`;
  ratingBody.appendChild(ratingNote);
  ratingCard.appendChild(ratingBody);

  twoCol.appendChild(groupCard);
  twoCol.appendChild(ratingCard);
  container.appendChild(twoCol);

  // Build initial rating dist (not filtered by course since spec says "mean rating")
  buildRatingDist(ratingDist, ratingBarsWrap, ratings.length);

  /* ── Statement means ── */
  const stmtCard = document.createElement('div');
  stmtCard.className = 'card mb-16';
  const stmtBody = document.createElement('div');
  stmtBody.className = 'card-body';
  const stmtTitle = document.createElement('div');
  stmtTitle.className = 'section-title mb-8';
  stmtTitle.textContent = 'Min mengikut pernyataan';
  stmtBody.appendChild(stmtTitle);
  const stmtTableWrap = document.createElement('div');
  stmtTableWrap.id = 'stmt-means-table';
  stmtBody.appendChild(stmtTableWrap);
  stmtCard.appendChild(stmtBody);
  container.appendChild(stmtCard);

  /* ── Course table ── */
  const courseCard = document.createElement('div');
  courseCard.className = 'card mb-16';
  const courseBody = document.createElement('div');
  courseBody.className = 'card-body';
  const courseTitle = document.createElement('div');
  courseTitle.className = 'section-title mb-8';
  courseTitle.textContent = 'Respons mengikut kursus';
  courseBody.appendChild(courseTitle);
  const courseTableWrap = document.createElement('div');
  courseTableWrap.id = 'course-table';
  courseBody.appendChild(courseTableWrap);
  courseCard.appendChild(courseBody);
  container.appendChild(courseCard);

  /* ── Programme table ── */
  const progCard = document.createElement('div');
  progCard.className = 'card mb-16';
  const progBody = document.createElement('div');
  progBody.className = 'card-body';
  const progTitle = document.createElement('div');
  progTitle.className = 'section-title mb-8';
  progTitle.textContent = 'Respons mengikut program';
  progBody.appendChild(progTitle);
  const progTableWrap = document.createElement('div');
  progTableWrap.id = 'programme-table';
  progBody.appendChild(progTableWrap);
  progCard.appendChild(progBody);
  container.appendChild(progCard);

  /* ── Open answers ── */
  const openCard = document.createElement('div');
  openCard.className = 'card mb-16';
  const openBody = document.createElement('div');
  openBody.className = 'card-body';
  const openTitle = document.createElement('div');
  openTitle.className = 'section-title mb-8';
  openTitle.textContent = 'Jawapan terbuka';
  openBody.appendChild(openTitle);
  const openWrap = document.createElement('div');
  openWrap.id = 'open-answers-wrap';
  openBody.appendChild(openWrap);
  openCard.appendChild(openBody);
  container.appendChild(openCard);

  /* Initial build */
  rebuildStats(yearResps);

  /* ─── update functions ─── */
  function updateGroupMeansSection(filtered) {
    const el = document.getElementById('group-means-table');
    if (!el) return;
    el.innerHTML = '';
    const table = document.createElement('table');
    table.className = 'group-table';
    const thead = document.createElement('thead');
    thead.innerHTML = '<tr><th>Kumpulan</th><th>Min</th></tr>';
    table.appendChild(thead);
    const tbody = document.createElement('tbody');
    STATEMENT_GROUPS.forEach(g => {
      const vals = filtered.flatMap(r => r.jawapan.slice(g.start, g.end));
      const m = mean(vals);
      const tr = document.createElement('tr');
      const tdName = document.createElement('td');
      tdName.textContent = g.label;
      const tdMean = document.createElement('td');
      tdMean.innerHTML = meanPill(m);
      tr.appendChild(tdName);
      tr.appendChild(tdMean);
      tbody.appendChild(tr);
    });
    // overall row
    const allVals = filtered.flatMap(r => r.jawapan);
    const overallM = mean(allVals);
    const trAll = document.createElement('tr');
    trAll.style.fontWeight = '700';
    const tdN = document.createElement('td');
    tdN.textContent = 'Keseluruhan';
    const tdM = document.createElement('td');
    tdM.innerHTML = meanPill(overallM);
    trAll.appendChild(tdN);
    trAll.appendChild(tdM);
    tbody.appendChild(trAll);
    table.appendChild(tbody);
    el.appendChild(table);
  }

  function updateStmtMeansSection(filtered) {
    const el = document.getElementById('stmt-means-table');
    if (!el) return;
    el.innerHTML = '';
    const table = document.createElement('table');
    table.className = 'group-table';
    const thead = document.createElement('thead');
    thead.innerHTML = '<tr><th>#</th><th>Pernyataan</th><th>Min</th></tr>';
    table.appendChild(thead);
    const tbody = document.createElement('tbody');
    STATEMENT_GROUPS.forEach(g => {
      // group header row
      const trGrp = document.createElement('tr');
      trGrp.style.background = 'var(--surface)';
      const tdGrp = document.createElement('td');
      tdGrp.colSpan = 3;
      tdGrp.style.fontWeight = '700';
      tdGrp.style.fontSize = '12px';
      tdGrp.style.color = 'var(--muted)';
      tdGrp.textContent = g.label;
      trGrp.appendChild(tdGrp);
      tbody.appendChild(trGrp);

      for (let i = g.start; i < g.end; i++) {
        const vals = filtered.map(r => r.jawapan[i]);
        const m = mean(vals);
        const tr = document.createElement('tr');
        const tdNum = document.createElement('td');
        tdNum.textContent = i + 1;
        tdNum.style.color = 'var(--muted)';
        tdNum.style.fontSize = '12px';
        const tdLbl = document.createElement('td');
        tdLbl.textContent = STATEMENT_LABELS[i];
        tdLbl.style.fontSize = '12px';
        const tdMean = document.createElement('td');
        tdMean.style.whiteSpace = 'nowrap';
        tdMean.innerHTML = meanPill(m);
        tr.appendChild(tdNum);
        tr.appendChild(tdLbl);
        tr.appendChild(tdMean);
        tbody.appendChild(tr);
      }
    });
    table.appendChild(tbody);
    el.appendChild(table);
  }

  function updateOpenAnswers(filtered) {
    const el = document.getElementById('open-answers-wrap');
    if (!el) return;
    el.innerHTML = '';
    const cats = [
      { field: 'berguna', title: 'Ciri paling berguna' },
      { field: 'cabaran', title: 'Cabaran yang dihadapi' },
      { field: 'cadangan', title: 'Cadangan penambahbaikan' },
    ];
    cats.forEach(cat => {
      const answers = filtered.map(r => r[cat.field]).filter(s => !isBlankAnswer(s));
      if (answers.length === 0) return;
      const sec = document.createElement('div');
      sec.className = 'open-answers-section';
      const ttl = document.createElement('div');
      ttl.className = 'font-bold text-sm mb-8';
      ttl.textContent = `${cat.title} (${answers.length})`;
      sec.appendChild(ttl);
      answers.forEach(ans => {
        const item = document.createElement('div');
        item.className = 'open-answer-item';
        item.textContent = ans;
        sec.appendChild(item);
      });
      el.appendChild(sec);
    });
    if (el.innerHTML === '') {
      const msg = document.createElement('div');
      msg.className = 'text-muted text-sm';
      msg.textContent = 'Tiada jawapan terbuka untuk penapis ini.';
      el.appendChild(msg);
    }
  }

  function updateCourseTable(filtered) {
    const el = document.getElementById('course-table');
    if (!el) return;
    el.innerHTML = '';
    const table = document.createElement('table');
    table.className = 'group-table';
    const thead = document.createElement('thead');
    thead.innerHTML = '<tr><th>Kursus</th><th>Respons</th><th>Min</th></tr>';
    table.appendChild(thead);
    const tbody = document.createElement('tbody');
    const coursesInFilter = [...new Set(filtered.map(r => r.kursus))].sort();
    coursesInFilter.forEach(c => {
      const cResps = filtered.filter(r => r.kursus === c);
      const m = mean(cResps.flatMap(r => r.jawapan));
      const tr = document.createElement('tr');
      const tdC = document.createElement('td');
      tdC.textContent = c;
      const tdN = document.createElement('td');
      tdN.textContent = cResps.length;
      const tdM = document.createElement('td');
      tdM.innerHTML = meanPill(m);
      tr.appendChild(tdC);
      tr.appendChild(tdN);
      tr.appendChild(tdM);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    el.appendChild(table);
  }

  function updateProgrammeTable(filtered) {
    const el = document.getElementById('programme-table');
    if (!el) return;
    el.innerHTML = '';
    const table = document.createElement('table');
    table.className = 'group-table';
    const thead = document.createElement('thead');
    thead.innerHTML = '<tr><th>Program</th><th>Respons</th><th>Min</th></tr>';
    table.appendChild(thead);
    const tbody = document.createElement('tbody');
    const progsInFilter = [...new Set(filtered.map(r => r.program))].sort();
    progsInFilter.forEach(p => {
      const pResps = filtered.filter(r => r.program === p);
      const m = mean(pResps.flatMap(r => r.jawapan));
      const tr = document.createElement('tr');
      const tdP = document.createElement('td');
      tdP.textContent = p;
      const tdN = document.createElement('td');
      tdN.textContent = pResps.length;
      const tdM = document.createElement('td');
      tdM.innerHTML = meanPill(m);
      tr.appendChild(tdP);
      tr.appendChild(tdN);
      tr.appendChild(tdM);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    el.appendChild(table);
  }
}

function buildRatingDist(ratingDist, container, total) {
  container.innerHTML = '';
  const maxCount = Math.max(...ratingDist.map(d => d.count), 1);
  [5,4,3,2,1].forEach(v => {
    const d = ratingDist.find(x => x.v === v) || { v, count: 0 };
    const row = document.createElement('div');
    row.className = 'rating-bar-row';
    const lbl = document.createElement('span');
    lbl.style.width = '24px';
    lbl.style.textAlign = 'right';
    lbl.textContent = v + '★';
    const track = document.createElement('div');
    track.className = 'rating-bar-track';
    const fill = document.createElement('div');
    fill.className = 'rating-bar-fill';
    fill.style.width = total > 0 ? (d.count / total * 100) + '%' : '0%';
    track.appendChild(fill);
    const cnt = document.createElement('div');
    cnt.className = 'rating-bar-count';
    cnt.textContent = d.count;
    row.appendChild(lbl);
    row.appendChild(track);
    row.appendChild(cnt);
    container.appendChild(row);
  });
}

/* ═══════════════════════════════════════════════

function renderDashboardPage() {
  const container = document.getElementById('dashboard-content');
  container.innerHTML = '';

  const yd = getYearData(currentYear);
  const marks = getMarks(currentYear);
  const { overall, stars, elementScores, anyMarked } = computeScore(marks);
  const utilPct = computeUtility(currentYear);

  /* ── Export / Import bar ── */
  const ioBar = document.createElement('div');
  ioBar.className = 'io-bar';

  const exportBtn = document.createElement('button');
  exportBtn.className = 'btn btn-secondary';
  exportBtn.textContent = 'Eksport data';
  exportBtn.addEventListener('click', exportData);

  const importBtn = document.createElement('button');
  importBtn.className = 'btn btn-secondary';
  importBtn.textContent = 'Import data';

  importInput.type = 'file';
  importInput.accept = '.json';
  importInput.style.display = 'none';
  importInput.setAttribute('aria-hidden', 'true');
  importBtn.addEventListener('click', () => importInput.click());
  importInput.addEventListener('change', () => importData(importInput));

  const ioMsg = document.createElement('span');
  ioMsg.id = 'io-msg';

  ioBar.appendChild(exportBtn);
  ioBar.appendChild(importBtn);

  /* ── Banner ── */
  const banner = document.createElement('div');
  banner.className = 'dash-banner';

  const bl = document.createElement('div');
  bl.className = 'dash-banner-left';

  const tag = document.createElement('div');
  tag.className = 'dash-banner-tag';
  tag.textContent = `STAR RATING ${currentYear}`;

  const scoreEl = document.createElement('div');
  scoreEl.className = 'dash-banner-score';

  } else {

    num.textContent = overall;

    den.className = 'dash-banner-denom';

    scoreEl.appendChild(den);
  }

  const msg = document.createElement('div');
  msg.className = 'dash-banner-msg';
  msg.textContent = anyMarked ? nextStarMsg(overall, stars) : '0 daripada 17 item dinilai.';

  const goBtn = document.createElement('button');
  goBtn.className = 'dash-banner-btn';
  goBtn.textContent = 'Isi penilaian';

  bl.appendChild(tag);

  bl.appendChild(msg);
  bl.appendChild(goBtn);

  const br = document.createElement('div');

  const starsRow = document.createElement('div');

    const s = document.createElement('span');

    s.textContent = '★';

  /* ── 4 Stat cards ── */

  const utilStr = utilPct !== null ? utilPct.toFixed(1) + '%' : '—';

  const utilBelow = utilPct !== null && utilPct < 75;

  const maintCount = yd.maintenance.length;

  // Items with evidence (at least 1 image)

  const statCards = [
    {
      icon: '⏱',
      val: utilStr,
      tag: utilPct !== null ? `Kadar utiliti (${Math.round(yd.utility.monthly.reduce((s,v)=>s+(v!==''?Number(v):0),0) || Number(yd.utility.hoursUsed)||0)} / ${Number(yd.utility.hoursAvailable)||0} jam)` : 'Kadar utiliti',

    },
    {
      icon: '📅',
      val: actCount,
      tag: 'Aktiviti TeCC',
      badge: null,
    },
    {
      icon: '🔧',
      val: maintCount,
      tag: 'Rekod penyelenggaraan',
      badge: null,

    {
      icon: '✅',
      val: `${itemsWithEvidence} / 17`,

      badge: allHaveEvidence ? { text: 'Lengkap', cls: 'badge-green' } : null,

      badge.textContent = sc.badge.text;
      val.appendChild(badge);

    tag.textContent = sc.tag;

  elemCard.className = 'card';
  const elemBody = document.createElement('div');
  elemBody.className = 'card-body';
  const elemTitle = document.createElement('div');
  elemTitle.className = 'section-title mb-8';
  elemTitle.textContent = 'Skor ikut elemen';
  // legend
  const legend = document.createElement('div');
  legend.style.cssText = 'display:flex;gap:12px;font-size:11px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap;';
  [['var(--accent2)', 'Diperoleh'], ['var(--hatch)', 'Belum dinilai'], ['var(--border)', 'Hilang']].forEach(([bg, lbl]) => {
    const item = document.createElement('div');
    item.style.cssText = 'display:flex;align-items:center;gap:4px;';
    const dot = document.createElement('span');
    dot.style.cssText = `width:10px;height:10px;border-radius:2px;background:${bg};display:inline-block;flex-shrink:0;`;
    const txt = document.createTextNode(lbl);
    item.appendChild(dot);
    item.appendChild(txt);
    legend.appendChild(item);
  });
  elemBody.appendChild(elemTitle);
  elemBody.appendChild(legend);

  elementScores.forEach((es, idx) => {
    const el = ELEMENTS[idx];
    const row = document.createElement('div');
    row.className = 'elem-score-row';

    const labelRow = document.createElement('div');
    labelRow.className = 'elem-score-label';
    const nameSpan = document.createElement('span');
    nameSpan.textContent = es.name;
    const pctSpan = document.createElement('span');
    pctSpan.className = 'elem-score-pct';
    pctSpan.textContent = `${(el.weight*100).toFixed(0)}%`;
    labelRow.appendChild(nameSpan);
    labelRow.appendChild(pctSpan);

    const scoreNum = document.createElement('div');
    scoreNum.style.cssText = 'font-size:22px;font-weight:800;line-height:1;margin-bottom:4px;';
    scoreNum.textContent = anyMarked ? es.pct100.toFixed(0) : '—';
    if (anyMarked) {
      const d = document.createElement('span');
      d.style.cssText = 'font-size:13px;font-weight:400;color:var(--muted);';
      d.textContent = ' / 100';
      scoreNum.appendChild(d);
    }

    const barWrap = document.createElement('div');
    barWrap.className = 'elem-bar-wrap';
    barWrap.setAttribute('role', 'img');
    const earnedPct = (es.earned / es.maxPossible) * 100;
    const unPct = (es.unassessed / es.maxPossible) * 100;
    const lostPct = 100 - earnedPct - unPct;
    if (earnedPct > 0) { const b = document.createElement('div'); b.className = 'elem-bar-earned'; b.style.width = earnedPct + '%'; barWrap.appendChild(b); }
    if (unPct > 0)     { const b = document.createElement('div'); b.className = 'elem-bar-unassessed'; b.style.width = unPct + '%'; barWrap.appendChild(b); }
    if (lostPct > 0.01){ const b = document.createElement('div'); b.className = 'elem-bar-lost'; b.style.width = lostPct + '%'; barWrap.appendChild(b); }

    const subText = document.createElement('div');
    subText.style.cssText = 'font-size:11px;color:var(--muted);margin-top:2px;';
    const contrib = (es.earned / es.maxPossible * 100 * es.weight).toFixed(1);
    const unContrib = (es.unassessed / es.maxPossible * 100 * es.weight).toFixed(1);
    subText.textContent = `Sumbang ${contrib} daripada ${(es.weight*100).toFixed(0)} mata · ${unContrib} mata belum dinilai`;

    row.appendChild(labelRow);
    row.appendChild(scoreNum);
    row.appendChild(barWrap);
    row.appendChild(subText);
    elemBody.appendChild(row);
  });
  elemCard.appendChild(elemBody);

  dashGrid.appendChild(actCard);
  dashGrid.appendChild(elemCard);
  container.appendChild(dashGrid);

  /* ── Recent evidence ── */
  const allImages = [];
  ELEMENTS.forEach(el => {
    el.items.forEach(it => {
      (yd.items[it.id]?.images || []).forEach(img => {
        allImages.push({ ...img, itemId: it.id, itemName: it.name });
      });
    });
  });
  // Sort by date desc (date is a string "YYYY-MM-DD HH:MM")
  allImages.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const recent = allImages.slice(0, 6);

  const recentCard = document.createElement('div');
  recentCard.className = 'card';
  const recentBody = document.createElement('div');
  recentBody.className = 'card-body';
  const recentHeader = document.createElement('div');
  recentHeader.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;';
  const recentTitle = document.createElement('div');
  recentTitle.className = 'section-title';
  recentTitle.style.marginBottom = '0';
  recentTitle.textContent = 'Bukti terkini';
  const seeAllBtn = document.createElement('button');
  seeAllBtn.className = 'btn btn-secondary btn-sm';
  seeAllBtn.textContent = 'Lihat semua';
  seeAllBtn.addEventListener('click', () => navigateTo('galeri'));
  recentHeader.appendChild(recentTitle);
  recentHeader.appendChild(seeAllBtn);
  recentBody.appendChild(recentHeader);

  if (recent.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'text-align:center;color:var(--muted);padding:24px;font-size:13px;';
    empty.textContent = 'Tiada bukti dimuat naik lagi.';
    recentBody.appendChild(empty);
  } else {
    const grid = document.createElement('div');
    grid.className = 'recent-evidence-grid';
    recent.forEach(img => {
      const card = document.createElement('div');
      card.className = 'recent-card';
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', img.itemName);
      const imgEl = document.createElement('img');
      imgEl.src = img.dataUrl;
      imgEl.alt = img.note || img.itemName;
      imgEl.loading = 'lazy';
      const meta = document.createElement('div');
      meta.className = 'recent-card-meta';
      const strong = document.createElement('strong');
      strong.textContent = `${img.itemId}. ${img.itemName}`;
      const line2 = document.createElement('span');
      line2.textContent = (img.uploader || '—') + ' · ' + (img.date || '').slice(0, 10);
      meta.appendChild(strong);
      meta.appendChild(document.createElement('br'));
      meta.appendChild(line2);
      card.appendChild(imgEl);
      card.appendChild(meta);
      const open = () => openImageModal(img, img.itemId, null);
      card.addEventListener('click', open);
      card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') open(); });
      grid.appendChild(card);
    });
    recentBody.appendChild(grid);
  }
  recentCard.appendChild(recentBody);
  container.appendChild(recentCard);
}

/* ── Activity bar chart (inline SVG) ── */
function buildActivityChart(activities) {
  const wrap = document.createElement('div');
  wrap.className = 'chart-wrap';

  // Count per month 0-11
  const counts = Array(12).fill(0);
  let noDateCount = 0;
  activities.forEach(a => {
    if (!a.date) { noDateCount++; return; }
    const m = parseInt(a.date.slice(5, 7), 10) - 1;
    if (m >= 0 && m < 12) counts[m]++;
    else noDateCount++;
  });

  const maxCount = Math.max(...counts, 1);
  const W = 520, H = 160, padL = 24, padB = 28, padT = 16, padR = 8;
  const chartW = W - padL - padR;
  const chartH = H - padB - padT;
  const barW = Math.floor(chartW / 12) - 4;

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', '100%');
  svg.setAttribute('aria-label', 'Carta bar aktiviti bulanan');
  svg.setAttribute('role', 'img');
  svg.style.maxWidth = W + 'px';

  // Grid lines
  const gridVals = maxCount <= 2 ? [0,1,2] : [0, Math.round(maxCount/2), maxCount];
  gridVals.forEach(v => {
    const y = padT + chartH - (v / maxCount) * chartH;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', padL); line.setAttribute('x2', W - padR);
    line.setAttribute('y1', y); line.setAttribute('y2', y);
    line.setAttribute('stroke', 'var(--border)');
    line.setAttribute('stroke-width', '1');
    svg.appendChild(line);
    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txt.setAttribute('x', padL - 3); txt.setAttribute('y', y + 4);
    txt.setAttribute('text-anchor', 'end');
    txt.setAttribute('font-size', '9');
    txt.setAttribute('fill', 'var(--muted)');
    txt.textContent = v;
    svg.appendChild(txt);
  });

  // Bars + month labels
  counts.forEach((cnt, i) => {
    const x = padL + i * (chartW / 12) + 2;
    const barH = cnt === 0 ? 0 : Math.max(4, (cnt / maxCount) * chartH);
    const y = padT + chartH - barH;

    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', barW); rect.setAttribute('height', barH);
    rect.setAttribute('fill', 'var(--accent2)');
    rect.setAttribute('rx', '3');
    rect.setAttribute('aria-label', `${MONTHS_BM[i]}: ${cnt}`);
    svg.appendChild(rect);

    const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    lbl.setAttribute('x', x + barW / 2); lbl.setAttribute('y', H - 6);
    lbl.setAttribute('text-anchor', 'middle');
    lbl.setAttribute('font-size', '9');
    lbl.setAttribute('fill', 'var(--muted)');
    lbl.textContent = MONTHS_BM[i];
    svg.appendChild(lbl);
  });

  wrap.appendChild(svg);

  if (noDateCount > 0) {
    const note = document.createElement('div');
    note.className = 'text-xs text-muted mt-4';
    note.textContent = `${noDateCount} aktiviti tiada tarikh, jadi tak masuk dalam carta.`;
    wrap.appendChild(note);
  }

  if (activities.length === 0) {
    const note = document.createElement('div');
    note.className = 'text-xs text-muted mt-4';
    note.textContent = 'Tiada aktiviti direkodkan lagi.';
    wrap.appendChild(note);
  }

  return wrap;
}

/* ═══════════════════════════════════════════════
   EXPORT / IMPORT
═══════════════════════════════════════════════ */
function exportData() {
  try {
    const json = JSON.stringify(appData, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `tecc-pns-data-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showIoMsg('Data berjaya dieksport.');
  } catch(e) {
    showIoMsg('Gagal eksport: ' + e.message, true);
  }
}

function importData(fileInput) {
  const file = fileInput.files[0];
  if (!file) return;
  fileInput.value = '';
  const reader = new FileReader();
  reader.onerror = () => showIoMsg('Gagal baca fail.', true);
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      // basic validation: must have at least one year key
      const years = ['2024','2025','2026','2027'];
      const hasYear = years.some(y => y in parsed);
      if (!hasYear) throw new Error('Fail JSON tidak sah – tiada data tahun yang dikenali.');
      // merge in: keep existing years not in file, override those that are
      years.forEach(y => {
        if (parsed[y]) appData[y] = parsed[y];
      });
      saveData();
      showIoMsg('Import berjaya! Data dikemas kini.');
      renderActivePage();
    } catch(err) {
      showIoMsg('Import gagal: ' + err.message, true);
    }
  };
  reader.readAsText(file);
}

function showIoMsg(msg, isError = false) {
  const el = document.getElementById('io-msg');
  if (!el) return;
  el.textContent = msg;
  el.style.color = isError ? 'var(--red)' : 'var(--green)';
  setTimeout(() => { el.textContent = ''; }, 5000);
}

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
function init() {
  buildNav();
  buildYearTabs();

  // Wire modal close buttons
  document.getElementById('modal-close-btn').addEventListener('click', closeImageModal);
  document.getElementById('modal-close-btn2').addEventListener('click', closeImageModal);
  document.getElementById('img-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('img-modal')) closeImageModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeImageModal();
  });

  navigateTo('dashboard');
}

init();
