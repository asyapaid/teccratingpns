<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeCC Star Rating PNS</title>
<style>
/* ── CSS Variables ── */
:root {
  --bg: #ffffff;
  --surface: #f7f8fa;
  --border: #e5e7eb;
  --text: #1f2328;
  --muted: #57606a;
  --accent: #1e3a5f;
  --accent2: #2563eb;
  --gold: #d97706;
  --gold-light: #fbbf24;
  --green: #16a34a;
  --red: #dc2626;
  --orange: #ea580c;
  --star-empty: #d1d5db;
  --nav-bg: #1e3a5f;
  --nav-text: #e2e8f0;
  --nav-active: #2563eb;
  --banner-bg: #1e3a5f;
  --banner-text: #ffffff;
  --card-bg: #ffffff;
  --input-bg: #ffffff;
  --input-border: #d1d5db;
  --focus: #2563eb;
  --hatch: repeating-linear-gradient(45deg, #d1d5db 0px, #d1d5db 2px, transparent 2px, transparent 6px);
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2d3142;
    --text: #e2e8f0;
    --muted: #8b95a8;
    --accent: #1e3a5f;
    --accent2: #3b82f6;
    --nav-bg: #0d1a2e;
    --nav-text: #cbd5e1;
    --nav-active: #3b82f6;
    --banner-bg: #0d1a2e;
    --card-bg: #1a1d27;
    --input-bg: #1a1d27;
    --input-border: #374151;
    --star-empty: #4b5563;
    --hatch: repeating-linear-gradient(45deg, #374151 0px, #374151 2px, transparent 2px, transparent 6px);
  }
}

/* ── Reset / Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  font-variant-numeric: tabular-nums;
}
a { color: var(--accent2); }
a:hover { text-decoration: underline; }
button, select, input, textarea {
  font-family: inherit;
  font-size: inherit;
}
button { cursor: pointer; }
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

/* ── Layout ── */
#app { display: flex; min-height: 100vh; }

/* Side nav */
#sidenav {
  width: 200px;
  min-width: 200px;
  background: var(--nav-bg);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.nav-logo {
  padding: 18px 16px 14px;
  border-bottom: 1px solid rgba(255,255,255,.08);
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-logo-star { color: var(--gold-light); font-size: 22px; }
.nav-logo-title { color: #fff; font-weight: 700; font-size: 14px; line-height: 1.2; }
.nav-logo-sub { color: var(--nav-text); font-size: 11px; opacity: .7; }
.nav-links { padding: 8px 0; flex: 1; }
.nav-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  color: var(--nav-text);
  text-decoration: none;
  font-size: 14px;
  border-left: 3px solid transparent;
  transition: background .15s, border-color .15s;
  cursor: pointer;
  background: none;
  border-right: none;
  border-top: none;
  border-bottom: none;
  width: 100%;
  text-align: left;
}
.nav-link:hover { background: rgba(255,255,255,.07); }
.nav-link.active {
  background: rgba(37,99,235,.25);
  border-left-color: var(--accent2);
  color: #fff;
}
.nav-link svg { flex-shrink: 0; opacity: .75; }
.nav-link.active svg { opacity: 1; }
.nav-footer {
  padding: 12px 16px;
  color: var(--nav-text);
  font-size: 11px;
  opacity: .55;
  border-top: 1px solid rgba(255,255,255,.08);
}

/* Main content */
#main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* Top bar */
#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 24px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  gap: 12px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 10;
}
#topbar h1 { font-size: 20px; font-weight: 700; }
.year-tabs { display: flex; gap: 4px; }
.year-tab {
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background .15s;
}
.year-tab.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.save-indicator {
  font-size: 12px;
  color: var(--muted);
  flex-shrink: 0;
}

/* Page content */
.page { display: none; padding: 24px; }
.page.active { display: block; }

/* Cards */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card-body { padding: 20px; }
.card-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-title { font-size: 15px; font-weight: 700; }

/* ── Element page banner ── */
.element-banner {
  background: var(--banner-bg);
  color: var(--banner-text);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.element-banner-left {}
.element-banner-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .7; }
.element-banner-name { font-size: 20px; font-weight: 800; margin: 2px 0; }
.element-banner-weight { font-size: 13px; opacity: .75; }
.element-banner-right { text-align: right; }
.element-banner-score { font-size: 40px; font-weight: 800; line-height: 1; }
.element-banner-score-denom { font-size: 14px; opacity: .6; }
.element-banner-pct { font-size: 13px; opacity: .8; margin-top: 2px; }

/* ── Rubric item card (element pages) ── */
.elem-rubric-item {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 12px;
  overflow: hidden;
}
.elem-rubric-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.elem-rubric-num {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.elem-rubric-title { font-weight: 700; font-size: 14px; flex: 1; }
.elem-rubric-max { font-size: 12px; color: var(--muted); white-space: nowrap; }

.elem-rubric-body { padding: 14px 16px; }

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
@media (max-width: 500px) {
  .field-row { grid-template-columns: 1fr; }
}
.field-group { display: flex; flex-direction: column; gap: 4px; }
.field-group label { font-size: 12px; color: var(--muted); font-weight: 500; }
.field-input {
  padding: 7px 10px;
  border: 1px solid var(--input-border);
  border-radius: 5px;
  background: var(--input-bg);
  color: var(--text);
  width: 100%;
}
.field-input:focus { border-color: var(--focus); }
.field-input.mark-num { font-size: 16px; font-weight: 700; text-align: right; }
select.field-input { appearance: auto; }
textarea.field-input { resize: vertical; min-height: 56px; }

.mark-bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.mark-bar-track {
  flex: 1;
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.mark-bar-fill { height: 100%; background: var(--accent2); border-radius: 4px; transition: width .3s; }
.mark-bar-label { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* Upload area (placeholder for stage 3) */
/* ── Evidence upload ── */
.upload-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border: 1.5px dashed var(--input-border);
  border-radius: 6px;
  background: none;
  color: var(--accent2);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  margin-top: 8px;
}
.upload-btn:hover { border-color: var(--accent2); background: var(--surface); }

.thumb-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.thumb-item {
  position: relative;
  width: 80px;
  height: 80px;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--border);
  cursor: pointer;
  background: var(--surface);
  flex-shrink: 0;
}
.thumb-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb-item:hover::after {
  content: '🔍';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.35);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

/* ── Image lightbox / modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-overlay.hidden { display: none; }
.modal-box {
  background: var(--card-bg);
  border-radius: var(--radius);
  max-width: 720px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px;
  position: relative;
}
.modal-close {
  position: absolute;
  top: 12px;
  right: 14px;
  background: none;
  border: none;
  font-size: 22px;
  color: var(--muted);
  cursor: pointer;
  line-height: 1;
}
.modal-img { width: 100%; border-radius: 6px; display: block; margin-bottom: 12px; max-height: 60vh; object-fit: contain; }
.modal-meta { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.modal-meta strong { color: var(--text); }
.modal-actions { margin-top: 14px; display: flex; gap: 8px; justify-content: flex-end; }

/* ── Galeri Bukti ── */
.gallery-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
  align-items: center;
}
.gallery-filter-label { font-size: 12px; color: var(--muted); }
.filter-btn {
  padding: 4px 12px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  transition: background .12s;
}
.filter-btn.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
}
@media (max-width: 400px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); } }
.gallery-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
}
.gallery-card:hover { border-color: var(--accent2); }
.gallery-card img { width: 100%; height: 120px; object-fit: cover; display: block; }
.gallery-card-meta { padding: 6px 8px; font-size: 11px; color: var(--muted); line-height: 1.4; }
.gallery-card-meta strong { color: var(--text); font-size: 12px; display: block; }
.gallery-empty { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 14px; }

/* ── Utility section ── */
.utility-section { margin-bottom: 20px; }
.utility-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
@media (max-width: 500px) { .utility-grid { grid-template-columns: 1fr; } }

.utility-meter-wrap {
  margin: 12px 0;
}
.utility-meter-track {
  position: relative;
  height: 28px;
  background: var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.utility-meter-fill {
  height: 100%;
  background: var(--accent2);
  border-radius: 6px;
  transition: width .4s;
  position: relative;
  z-index: 1;
}
.utility-meter-fill.on-target { background: var(--green); }
.utility-meter-fill.over-target { background: var(--green); }
.utility-meter-fill.below-target { background: var(--orange); }
/* Target band overlay */
.utility-target-band {
  position: absolute;
  top: 0;
  height: 100%;
  background: rgba(22,163,74,.18);
  border-left: 2px dashed #16a34a;
  border-right: 2px dashed #16a34a;
  z-index: 2;
  pointer-events: none;
}
.utility-meter-label {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}
.utility-pct-big {
  font-size: 32px;
  font-weight: 800;
  line-height: 1;
}
.utility-status {
  font-size: 12px;
  margin-top: 2px;
}
.utility-status.on-target { color: var(--green); }
.utility-status.below-target { color: var(--orange); }
.utility-status.over-target { color: var(--accent2); }

/* Monthly hours grid */
.monthly-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 10px;
}
@media (max-width: 500px) { .monthly-grid { grid-template-columns: repeat(3, 1fr); } }
.monthly-cell { display: flex; flex-direction: column; gap: 3px; }
.monthly-cell label { font-size: 10px; color: var(--muted); text-align: center; }
.monthly-cell input {
  text-align: center;
  padding: 5px 4px;
  border: 1px solid var(--input-border);
  border-radius: 4px;
  background: var(--input-bg);
  color: var(--text);
  font-size: 13px;
  width: 100%;
}
.monthly-cell input:focus { border-color: var(--focus); }

/* ── Log tables ── */
.log-section { margin-bottom: 20px; }
.log-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.log-title { font-size: 15px; font-weight: 700; }
.btn {
  padding: 7px 14px;
  border-radius: 6px;
  border: none;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s;
}
.btn:hover { opacity: .85; }
.btn-primary { background: var(--accent2); color: #fff; }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: var(--red); color: #fff; font-size: 12px; padding: 4px 10px; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

.log-form {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  display: none;
}
.log-form.open { display: block; }
.log-form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}
@media (max-width: 500px) { .log-form-grid { grid-template-columns: 1fr; } }
.log-form-actions { display: flex; gap: 8px; justify-content: flex-end; }

.log-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.log-table th {
  text-align: left;
  padding: 8px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
}
.log-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.log-table tr:last-child td { border-bottom: none; }
.log-empty { text-align: center; color: var(--muted); padding: 24px; font-size: 13px; }

/* Level badges */
.level-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}
.level-Jabatan { background: #dbeafe; color: #1e40af; }
.level-Institusi { background: #ede9fe; color: #5b21b6; }
.level-Kementerian { background: #fef3c7; color: #92400e; }
.level-Komuniti { background: #d1fae5; color: #065f46; }
@media (prefers-color-scheme: dark) {
  .level-Jabatan { background: #1e3a5f; color: #93c5fd; }
  .level-Institusi { background: #2e1065; color: #c4b5fd; }
  .level-Kementerian { background: #451a03; color: #fcd34d; }
  .level-Komuniti { background: #064e3b; color: #6ee7b7; }
}

/* ── Star Rating Page ── */
.sr-header {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}
@media (max-width: 640px) { .sr-header { grid-template-columns: 1fr; } }

.score-display {
  padding: 20px;
  background: var(--banner-bg);
  color: var(--banner-text);
  border-radius: var(--radius);
}
.score-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .7; margin-bottom: 4px; }
.score-big { font-size: 56px; font-weight: 800; line-height: 1; }
.score-denom { font-size: 18px; font-weight: 400; opacity: .6; }
.score-msg { font-size: 13px; margin-top: 6px; opacity: .85; }

.stars-display {
  padding: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
}
.stars-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
.stars-row { display: flex; gap: 6px; }
.star-icon { font-size: 28px; }
.star-icon.filled { color: var(--gold-light); }
.star-icon.empty { color: var(--star-empty); }
.stars-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }

.star-scale-label { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.star-scale-track {
  position: relative;
  height: 36px;
  border-radius: 4px;
  overflow: visible;
  display: flex;
}
.star-band {
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: rgba(255,255,255,.9);
  position: relative;
  overflow: hidden;
}
.star-band:first-child { border-radius: 4px 0 0 4px; }
.star-band:last-child { border-radius: 0 4px 4px 0; }
.star-band-1 { background: #6b7280; }
.star-band-2 { background: #9ca3af; }
.star-band-3 { background: #60a5fa; }
.star-band-4 { background: #3b82f6; }
.star-band-5 { background: #1e40af; }
.score-marker {
  position: absolute;
  top: -6px;
  width: 4px;
  height: 48px;
  background: var(--gold);
  border-radius: 2px;
  transform: translateX(-50%);
  z-index: 5;
}
.score-marker::after {
  content: '';
  position: absolute;
  top: -5px;
  left: 50%;
  transform: translateX(-50%);
  width: 10px;
  height: 10px;
  background: var(--gold);
  border-radius: 50%;
}
.star-scale-ticks {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
  font-size: 11px;
  color: var(--muted);
}

.element-summaries { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
@media (max-width: 700px) { .element-summaries { grid-template-columns: 1fr; } }
.elem-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
}
.elem-card-name { font-size: 13px; font-weight: 700; }
.elem-card-weight { font-size: 11px; color: var(--muted); }
.elem-card-score { font-size: 22px; font-weight: 800; margin: 4px 0; }
.elem-bar-wrap { height: 12px; background: var(--border); border-radius: 6px; overflow: hidden; display: flex; margin: 6px 0; }
.elem-bar-earned { background: var(--accent2); height: 100%; }
.elem-bar-unassessed { background: var(--hatch); height: 100%; }
.elem-bar-lost { background: var(--border); height: 100%; }
.elem-card-sub { font-size: 11px; color: var(--muted); }

.rubric-section { margin-bottom: 32px; }
.rubric-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--accent);
  color: #fff;
  border-radius: var(--radius) var(--radius) 0 0;
}
.rubric-section-title { font-size: 15px; font-weight: 700; }
.rubric-section-weight { font-size: 12px; opacity: .8; }
.rubric-item {
  border: 1px solid var(--border);
  border-top: none;
  padding: 14px 16px;
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 12px;
  align-items: start;
  background: var(--card-bg);
}

<script>
'use strict';

/* ═══════════════════════════════════════════════
   RUBRIC DATA (fixed)
═══════════════════════════════════════════════ */
const ELEMENTS = [
  {
    id: 'e1',
    name: 'Learning and Teaching Design',
    nameBM: 'Reka Bentuk P&P',
    weight: 0.5,
    items: [
      { id: 1,  name: 'Course Outline', max: 10 },
      { id: 2,  name: 'Reflection on the Semester Teaching Plan (RMS)', max: 10 },
      { id: 3,  name: "Students' Usage Reflection", max: 10 },

      { id: 6,  name: 'LMS CIDOS Platform', max: 20 },
      { id: 7,  name: 'Teaching and Learning Observation', max: 10 },
    ]
  },
  {
    id: 'e2',
    name: 'Space Management',
    nameBM: 'Pengurusan Ruang',
    weight: 0.3,
    items: [
      { id: 8,  name: 'Organizational implementation chart', max: 20 },
      { id: 9,  name: 'Planning on usage', max: 20 },
      { id: 10, name: 'Annual calendar', max: 10 },
      { id: 11, name: 'Utility factor (75-80%)', max: 10 },
      { id: 12, name: 'Usage schedule', max: 10 },
      { id: 13, name: 'SOP for equipment usage', max: 20 },
      { id: 14, name: 'Maintenance monitoring', max: 10 },
    ]
  },
  {
    id: 'e3',
    name: 'Sharing Knowledge',
    nameBM: 'Perkongsian Ilmu',
    weight: 0.2,
    items: [
      { id: 15, name: 'TeCC usage briefing/orientation', max: 30 },
      { id: 16, name: 'Number of activities in TeCC', max: 40 },
      { id: 17, name: 'Platform for disseminating TeCC activities', max: 30 },
    ]
  }
];

const ITEM_MAP = {};
ELEMENTS.forEach(el => el.items.forEach(it => { ITEM_MAP[it.id] = { ...it, element: el }; }));

const MONTHS_BM = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
const ACTIVITY_LEVELS = ['Jabatan','Institusi','Kementerian','Komuniti'];

/* ═══════════════════════════════════════════════
   SCORING FUNCTION (pure)
═══════════════════════════════════════════════ */
function computeScore(marks) {
  const elementScores = ELEMENTS.map(el => {
    let earned = 0, maxPossible = 0, unassessed = 0;
    el.items.forEach(it => {
      maxPossible += it.max;
      const v = marks[it.id];
      if (v === null || v === undefined || v === '') {
        unassessed += it.max;
      } else {
        earned += Number(v);
      }
    });
    const pct100 = (earned / maxPossible) * 100;
    return { id: el.id, name: el.name, weight: el.weight, earned, maxPossible, unassessed, pct100 };
  });

  const anyMarked = ELEMENTS.some(el =>
    el.items.some(it => marks[it.id] !== null && marks[it.id] !== undefined && marks[it.id] !== '')
  );

  if (!anyMarked) {
    return { overall: null, stars: 0, elementScores, anyMarked: false };
  }

  const raw = elementScores.reduce((sum, es) => sum + es.pct100 * es.weight, 0);
  const overall = Math.round(raw);

  let stars = 1;
  if (overall >= 71) stars = 5;
  else if (overall >= 61) stars = 4;
  else if (overall >= 41) stars = 3;
  else if (overall >= 21) stars = 2;
  else stars = 1;

  return { overall, stars, elementScores, anyMarked: true };
}

function nextStarMsg(overall, stars) {
  if (stars >= 5) return 'Tahniah! Skor maksimum 5 bintang dicapai.';
  const thresholds = [0, 21, 41, 61, 71, 101];
  const next = thresholds[stars];
  const needed = next - overall;
  return `${stars} bintang. Perlu ${needed} mata lagi untuk ${stars + 1} bintang (mula pada ${next}).`;
}

const STAR_BANDS = [
  { min: 0,  max: 21,  label: '1★', pct: 21 },
  { min: 21, max: 41,  label: '2★', pct: 20 },
  { min: 41, max: 61,  label: '3★', pct: 20 },

];

/* ═══════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════ */
const PAGES = [
  { id: 'dashboard',  label: 'Dashboard',           icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>' },

  { id: 'galeri',     label: 'Galeri Bukti',        icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>' },

function buildYearTabs() {
  const container = document.getElementById('year-tabs');
  container.innerHTML = '';
  ['2024','2025','2026','2027'].forEach(y => {
    const btn = document.createElement('button');
    btn.className = 'year-tab' + (y === currentYear ? ' active' : '');
    btn.textContent = y;
    btn.setAttribute('aria-pressed', y === currentYear ? 'true' : 'false');
    btn.addEventListener('click', () => { currentYear = y; buildYearTabs(); renderActivePage(); });
    container.appendChild(btn);
  });
}

function navigateTo(pageId) {
  currentPage = pageId;
  document.querySelectorAll('.nav-link').forEach(btn => {
    const active = btn.dataset.page === pageId;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-current', active ? 'page' : 'false');
  });
  const pg = PAGES.find(p => p.id === pageId);
  document.getElementById('page-title').textContent = pg ? pg.label : '';
  document.querySelectorAll('.page').forEach(el => {
    el.classList.toggle('active', el.id === 'page-' + pageId);
  });
  renderActivePage();
}

function renderActivePage() {
  if (currentPage === 'dashboard') renderDashboardPage();
  else if (currentPage === 'starrating') renderStarRatingPage();
  else if (currentPage === 'tl')    renderElementPage('e1');
  else if (currentPage === 'space') renderElementPage('e2');
  else if (currentPage === 'sharing') renderElementPage('e3');
  else if (currentPage === 'galeri') renderGaleriPage();
  else if (currentPage === 'students') renderStudentsPage();
}

/* ═══════════════════════════════════════════════
   LOCAL STORAGE
═══════════════════════════════════════════════ */
const LS_KEY = 'tecc_pns_v1';

function loadData() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultData();
    const parsed = JSON.parse(raw);
    // ensure all years exist
    ['2024','2025','2026','2027'].forEach(y => {
      if (!parsed[y]) parsed[y] = defaultYearData();
    });
    return parsed;
  } catch(e) { return defaultData(); }
}

function defaultYearData() {
  const items = {};
  ELEMENTS.forEach(el => el.items.forEach(it => {
    items[it.id] = { mark: '', status: 'Belum semak', link: '', note: '', images: [] };
  }));
  return {
    items,
    utility: { hoursUsed: '', hoursAvailable: '', monthly: Array(12).fill('') },
    activities: [],
    maintenance: [],
  };
}

function defaultData() {
  return { '2024': defaultYearData(), '2025': defaultYearData(), '2026': defaultYearData(), '2027': defaultYearData() };
}

let appData = loadData();

function saveData() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(appData));
    showSaveIndicator('Semua perubahan disimpan');
  } catch(e) {
    if (e.name === 'QuotaExceededError' || e.code === 22) {
      showSaveIndicator('⚠ Storan penuh! Data tidak disimpan.', true);
    } else {
      showSaveIndicator('⚠ Gagal simpan: ' + e.message, true);
    }
  }
}

let saveTimer = null;
function debouncedSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveData, 800);
}

function showSaveIndicator(msg, isError = false) {
  const el = document.getElementById('save-indicator');
  el.textContent = msg;
  el.style.color = isError ? 'var(--red)' : 'var(--muted)';
}

function getYearData(year) {
  if (!appData[year]) appData[year] = defaultYearData();
  // ensure utility.monthly exists
  if (!appData[year].utility) appData[year].utility = { hoursUsed: '', hoursAvailable: '', monthly: Array(12).fill('') };
  if (!appData[year].utility.monthly) appData[year].utility.monthly = Array(12).fill('');
  if (!appData[year].activities) appData[year].activities = [];
  if (!appData[year].maintenance) appData[year].maintenance = [];
  return appData[year];
}

function getMarks(year) {
  const yd = getYearData(year);
  const marks = {};
  ELEMENTS.forEach(el => el.items.forEach(it => {
    const v = yd.items[it.id]?.mark;
    marks[it.id] = (v === '' || v === null || v === undefined) ? null : Number(v);
  }));
  return marks;
}

/* Compute utility % for a year */
function computeUtility(year) {
  const yd = getYearData(year);
  const u = yd.utility;
  // If monthly hours filled, sum them as hoursUsed
  const monthlySum = u.monthly.reduce((s, v) => s + (v !== '' ? Number(v) : 0), 0);
  const hasMonthly = u.monthly.some(v => v !== '');
  const used = hasMonthly ? monthlySum : (u.hoursUsed !== '' ? Number(u.hoursUsed) : null);
  const avail = u.hoursAvailable !== '' ? Number(u.hoursAvailable) : null;
  if (used === null || avail === null || avail === 0) return null;
  return (used / avail) * 100;
}

  container.innerHTML = '';

  const el = ELEMENTS.find(e => e.id === elId);
  const yd = getYearData(currentYear);
  const marks = getMarks(currentYear);
  const { elementScores } = computeScore(marks);
  const es = elementScores.find(e => e.id === elId);

  /* ── Banner ── */
  const banner = document.createElement('div');
  banner.className = 'element-banner';

  const bl = document.createElement('div');
  bl.className = 'element-banner-left';
  const blLabel = document.createElement('div');
  blLabel.className = 'element-banner-label';
  blLabel.textContent = `ELEMEN ${elId.replace('e','')} · ${(el.weight*100).toFixed(0)}% WAJARAN`;
  const blName = document.createElement('div');
  blName.className = 'element-banner-name';
  blName.textContent = el.name;
  bl.appendChild(blLabel);
  bl.appendChild(blName);

  const br = document.createElement('div');
  br.className = 'element-banner-right';
  const brScore = document.createElement('div');
  brScore.className = 'element-banner-score';
  const anyMarked = Object.values(marks).some(v => v !== null);

  if (anyMarked) {
    const d = document.createElement('span');

  }

  brPct.className = 'element-banner-pct';
  brPct.textContent = `Sumbang ${(es.weight*100).toFixed(0)}% daripada skor keseluruhan`;
  br.appendChild(brScore);

  banner.appendChild(bl);
  banner.appendChild(br);

  /* ── Rubric items ── */

  sectionTitle.className = 'section-title';

  if (elId === 'e3') {

}

/* ── Build a single rubric item card ── */
function buildRubricItemCard(it, el, itemData) {

  title.textContent = it.name;

  maxLbl.className = 'elem-rubric-max';
  maxLbl.textContent = `Maks ${it.max}`;
  hdr.appendChild(num);
  hdr.appendChild(title);
  hdr.appendChild(maxLbl);
  card.appendChild(hdr);

  /* body */
  const body = document.createElement('div');
  body.className = 'elem-rubric-body';

  /* progress bar */
  const barRow = document.createElement('div');
  barRow.className = 'mark-bar-row';
  const track = document.createElement('div');
  track.className = 'mark-bar-track';
  const fill = document.createElement('div');
  fill.className = 'mark-bar-fill';
  const markVal = itemData.mark !== '' && itemData.mark !== null ? Number(itemData.mark) : 0;
  fill.style.width = (markVal / it.max * 100) + '%';
  fill.id = `bar-fill-${currentYear}-${it.id}`;
  track.appendChild(fill);
  const barLbl = document.createElement('div');
  barLbl.className = 'mark-bar-label';
  barLbl.textContent = itemData.mark !== '' && itemData.mark !== null ? `${itemData.mark} / ${it.max}` : `— / ${it.max}`;

  barRow.appendChild(track);
  barRow.appendChild(barLbl);
  body.appendChild(barRow);

  /* field row 1: mark + status */
  const row1 = document.createElement('div');
  row1.className = 'field-row';

  const markGroup = document.createElement('div');
  markGroup.className = 'field-group';
  const markLblEl = document.createElement('label');
  const markId = `mark-ep-${currentYear}-${it.id}`;
  markLblEl.htmlFor = markId;
  markLblEl.textContent = `Markah (0 – ${it.max})`;
  const markInp = document.createElement('input');
  markInp.type = 'number';
  markInp.id = markId;
  markInp.className = 'field-input mark-num';
  markInp.min = '0';
  markInp.max = it.max;

      if (n < 0) n = 0;
      if (n > it.max) n = it.max;
      v = n;
      markInp.value = v;
    }
    getYearData(currentYear).items[it.id].mark = v === '' ? '' : v;
    // update bar
    const pct = v === '' ? 0 : (Number(v) / it.max * 100);
    const f = document.getElementById(`bar-fill-${currentYear}-${it.id}`);
    const l = document.getElementById(`bar-lbl-${currentYear}-${it.id}`);
    if (f) f.style.width = pct + '%';
    if (l) l.textContent = v === '' ? `— / ${it.max}` : `${v} / ${it.max}`;
    debouncedSave();
  });
  markGroup.appendChild(markLblEl);
  markGroup.appendChild(markInp);

  const statusGroup = document.createElement('div');
  statusGroup.className = 'field-group';
  const statusLblEl = document.createElement('label');

  statusLblEl.htmlFor = statusId;
  statusLblEl.textContent = 'Status bukti';

  statusSel.className = 'field-input';

    o.value = opt;
    o.textContent = opt;
    statusSel.appendChild(o);
  });
  statusSel.value = itemData.status || 'Belum semak';
  statusSel.addEventListener('change', () => {
    getYearData(currentYear).items[it.id].status = statusSel.value;
    debouncedSave();
  });
  statusGroup.appendChild(statusLblEl);
  statusGroup.appendChild(statusSel);

  row1.appendChild(markGroup);
  row1.appendChild(statusGroup);
  body.appendChild(row1);

  /* field row 2: link + note */
  const row2 = document.createElement('div');
  row2.className = 'field-row';

  const linkGroup = document.createElement('div');
  linkGroup.className = 'field-group';
  const linkLblEl = document.createElement('label');

  linkInp.id = linkId;
  linkInp.className = 'field-input';
  linkInp.placeholder = 'https://...';
  linkInp.value = itemData.link || '';
  linkInp.addEventListener('input', () => {
    getYearData(currentYear).items[it.id].link = linkInp.value;
    debouncedSave();
  });
  linkGroup.appendChild(linkLblEl);
  linkGroup.appendChild(linkInp);

  const noteGroup = document.createElement('div');
  noteGroup.className = 'field-group';
  const noteLblEl = document.createElement('label');
  const noteId = `note-ep-${currentYear}-${it.id}`;
  noteLblEl.htmlFor = noteId;
  noteLblEl.textContent = 'Nota ringkas';
  const noteInp = document.createElement('textarea');
  noteInp.id = noteId;
  noteInp.className = 'field-input';
  noteInp.rows = 2;
  noteInp.textContent = itemData.note || '';
  noteInp.addEventListener('input', () => {
    getYearData(currentYear).items[it.id].note = noteInp.value;
    debouncedSave();
  });
  noteGroup.appendChild(noteLblEl);
  noteGroup.appendChild(noteInp);

  row2.appendChild(linkGroup);
  row2.appendChild(noteGroup);
  body.appendChild(row2);

  /* ── Upload zone ── */

  uploadZone.className = 'mt-8';
  uploadZone.id = `upload-zone-${it.id}`;

  const uploadBtn = document.createElement('button');
  uploadBtn.className = 'upload-btn';
  uploadBtn.type = 'button';
  uploadBtn.setAttribute('aria-label', `Muat naik bukti untuk ${it.name}`);
  uploadBtn.textContent = '+ Muat naik bukti';
  // hidden file input
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*';
  fileInput.multiple = true;
  fileInput.style.display = 'none';
  fileInput.setAttribute('aria-hidden', 'true');
  uploadBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => handleImageUpload(fileInput, it.id, thumbStrip));

  uploadZone.appendChild(uploadBtn);
  uploadZone.appendChild(fileInput);

  const thumbStrip = document.createElement('div');
  thumbStrip.className = 'thumb-strip';
  thumbStrip.id = `thumbs-${it.id}`;
  renderThumbs(it.id, thumbStrip);
  uploadZone.appendChild(thumbStrip);

/* ── Utility section (E2) ── */
function buildUtilitySection(yd) {
  const wrap = document.createElement('div');
  wrap.className = 'utility-section mt-20';

  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = 'Faktor Utiliti (Item 11)';
  wrap.appendChild(title);

  const card = document.createElement('div');
  card.className = 'card';
  const body = document.createElement('div');
  body.className = 'card-body';

  /* Current pct display */
  const pct = computeUtility(currentYear);
  const pctDisplay = document.createElement('div');
  pctDisplay.style.marginBottom = '16px';

  const pctBig = document.createElement('div');
  pctBig.className = 'utility-pct-big';
  pctBig.id = 'utility-pct-big';
  pctBig.textContent = pct !== null ? pct.toFixed(1) + '%' : '—';

  const pctStatus = document.createElement('div');
  pctStatus.className = 'utility-status';
  pctStatus.id = 'utility-pct-status';
  if (pct !== null) {
    if (pct >= 75 && pct <= 80) { pctStatus.classList.add('on-target'); pctStatus.textContent = 'Dalam sasaran (75–80%)'; }
    else if (pct < 75)          { pctStatus.classList.add('below-target'); pctStatus.textContent = `Di bawah sasaran – perlukan ${(75 - pct).toFixed(1)}% lagi`; }
    else                         { pctStatus.classList.add('over-target'); pctStatus.textContent = 'Melebihi 80%'; }
  } else {
    pctStatus.textContent = 'Masukkan jam untuk kira utiliti';
    pctStatus.style.color = 'var(--muted)';
  }
  pctDisplay.appendChild(pctBig);
  pctDisplay.appendChild(pctStatus);
  body.appendChild(pctDisplay);

  /* Meter bar */
  const meterWrap = document.createElement('div');
  meterWrap.className = 'utility-meter-wrap';
  const meterTrack = document.createElement('div');
  meterTrack.className = 'utility-meter-track';
  meterTrack.id = 'utility-meter-track';

  const meterFill = document.createElement('div');
  meterFill.id = 'utility-meter-fill';
  const fillPct = pct !== null ? Math.min(pct, 100) : 0;
  meterFill.style.width = fillPct + '%';
  if (pct !== null) {
    if (pct >= 75 && pct <= 80) meterFill.className = 'utility-meter-fill on-target';
    else if (pct < 75) meterFill.className = 'utility-meter-fill below-target';
    else meterFill.className = 'utility-meter-fill over-target';
  } else {
    meterFill.className = 'utility-meter-fill';
    meterFill.style.width = '0%';
  }
  meterTrack.appendChild(meterFill);

  /* Target band overlay 75–80% */
  const targetBand = document.createElement('div');
  targetBand.className = 'utility-target-band';
  targetBand.style.left = '75%';
  targetBand.style.width = '5%';
  targetBand.setAttribute('aria-label', 'Sasaran 75–80%');
  meterTrack.appendChild(targetBand);

  const meterLbl = document.createElement('div');
  meterLbl.className = 'utility-meter-label';
  ['0%','25%','50%','75%','80%','100%'].forEach(v => {
    const s = document.createElement('span');
    s.textContent = v;
    meterLbl.appendChild(s);
  });

  meterWrap.appendChild(meterTrack);
  meterWrap.appendChild(meterLbl);
  body.appendChild(meterWrap);

  /* Inputs: hours used & hours available */
  const inputGrid = document.createElement('div');
  inputGrid.className = 'utility-grid mt-16';

  function makeUtilityInput(lbl, id, placeholder, value) {
    const grp = document.createElement('div');
    grp.className = 'field-group';
    const label = document.createElement('label');
    label.htmlFor = id;
    label.textContent = lbl;
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.id = id;
    inp.className = 'field-input';
    inp.min = '0';
    inp.step = '0.5';
    inp.placeholder = placeholder;
    if (value !== '' && value !== null && value !== undefined) inp.value = value;
    return { grp, inp, label };
  }

  const { grp: usedGrp, inp: usedInp, label: usedLbl } = makeUtilityInput('Jam digunakan (jumlah)', 'util-used', '0', yd.utility.hoursUsed);
  usedGrp.appendChild(usedLbl);
  usedGrp.appendChild(usedInp);

  const { grp: availGrp, inp: availInp, label: availLbl } = makeUtilityInput('Jam tersedia (jumlah)', 'util-avail', '0', yd.utility.hoursAvailable);
  availGrp.appendChild(availLbl);
  availGrp.appendChild(availInp);

  function refreshUtility() {
    getYearData(currentYear).utility.hoursUsed = usedInp.value;
    getYearData(currentYear).utility.hoursAvailable = availInp.value;
    const p = computeUtility(currentYear);
    const bigEl = document.getElementById('utility-pct-big');
    const stEl = document.getElementById('utility-pct-status');
    const fillEl = document.getElementById('utility-meter-fill');
    if (bigEl) bigEl.textContent = p !== null ? p.toFixed(1) + '%' : '—';
    if (stEl) {
      stEl.className = 'utility-status';
      stEl.style.color = '';
      if (p !== null) {
        if (p >= 75 && p <= 80) { stEl.classList.add('on-target'); stEl.textContent = 'Dalam sasaran (75–80%)'; }
        else if (p < 75) { stEl.classList.add('below-target'); stEl.textContent = `Di bawah sasaran – perlukan ${(75 - p).toFixed(1)}% lagi`; }
        else { stEl.classList.add('over-target'); stEl.textContent = 'Melebihi 80%'; }
      } else { stEl.style.color = 'var(--muted)'; stEl.textContent = 'Masukkan jam untuk kira utiliti'; }
    }
    if (fillEl) {
      const fp = p !== null ? Math.min(p, 100) : 0;
      fillEl.style.width = fp + '%';
      fillEl.className = 'utility-meter-fill' + (p !== null ? (p >= 75 && p <= 80 ? ' on-target' : p < 75 ? ' below-target' : ' over-target') : '');
    }
    // update monthly sum display
    const sumEl = document.getElementById('monthly-sum-display');
    if (sumEl) {
      const ms = getYearData(currentYear).utility.monthly.reduce((s,v) => s + (v !== '' ? Number(v) : 0), 0);
      sumEl.textContent = `Jumlah bulanan: ${ms} jam`;
    }
    debouncedSave();
  }

  usedInp.addEventListener('input', refreshUtility);
  availInp.addEventListener('input', refreshUtility);

  inputGrid.appendChild(usedGrp);
  inputGrid.appendChild(availGrp);
  body.appendChild(inputGrid);

  /* Monthly hours */
  const monthlyTitle = document.createElement('div');
  monthlyTitle.className = 'font-bold text-sm mt-16 mb-8';
  monthlyTitle.textContent = 'Jam penggunaan bulanan (pilihan – jika diisi, jumlahnya akan gantikan "Jam digunakan")';
  body.appendChild(monthlyTitle);

  const monthlyGrid = document.createElement('div');
  monthlyGrid.className = 'monthly-grid';

  MONTHS_BM.forEach((m, idx) => {
    const cell = document.createElement('div');
    cell.className = 'monthly-cell';
    const lbl = document.createElement('label');
    const inpId = `monthly-${currentYear}-${idx}`;
    lbl.htmlFor = inpId;
    lbl.textContent = m;
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.id = inpId;
    inp.min = '0';
    inp.step = '0.5';
    inp.placeholder = '—';
    const storedVal = yd.utility.monthly[idx];
    if (storedVal !== '' && storedVal !== null && storedVal !== undefined) inp.value = storedVal;
    inp.addEventListener('input', () => {
      getYearData(currentYear).utility.monthly[idx] = inp.value;
      // recalculate used from monthly
      const ms = getYearData(currentYear).utility.monthly.reduce((s,v) => s + (v !== '' ? Number(v) : 0), 0);
      const hasAny = getYearData(currentYear).utility.monthly.some(v => v !== '');
      if (hasAny) {
        getYearData(currentYear).utility.hoursUsed = ms;
        usedInp.value = ms;
      }
      refreshUtility();
    });
    cell.appendChild(lbl);
    cell.appendChild(inp);
    monthlyGrid.appendChild(cell);
  });

  body.appendChild(monthlyGrid);

  const sumDisp = document.createElement('div');
  sumDisp.id = 'monthly-sum-display';
  sumDisp.className = 'text-xs text-muted mt-8';
  const ms = yd.utility.monthly.reduce((s,v) => s + (v !== '' ? Number(v) : 0), 0);
  sumDisp.textContent = `Jumlah bulanan: ${ms} jam`;
  body.appendChild(sumDisp);

  card.appendChild(body);
  wrap.appendChild(card);
  return wrap;
}

  descInp.type = 'text';
  descInp.id = 'maint-desc-inp';

  formGrid.appendChild(descGrp);

  cancelBtn.textContent = 'Batal';
  const saveBtn = document.createElement('button');
  saveBtn.className = 'btn btn-primary';
  saveBtn.textContent = 'Simpan';
  formActions.appendChild(cancelBtn);
  formActions.appendChild(saveBtn);
  form.appendChild(formActions);
  wrap.appendChild(form);

  const tableWrap = document.createElement('div');
  tableWrap.className = 'card';
  const table = document.createElement('table');
  table.className = 'log-table';
  const thead = document.createElement('thead');
  thead.innerHTML = '<tr><th>Tarikh</th><th>Keterangan</th><th></th></tr>';
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  tbody.id = 'maint-tbody';
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  wrap.appendChild(tableWrap);

  function refreshTable() {
    tbody.innerHTML = '';
    const records = getYearData(currentYear).maintenance;
    if (records.length === 0) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 3;
      td.className = 'log-empty';
      td.textContent = 'Tiada rekod penyelenggaraan lagi.';
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }
    records.forEach((rec, idx) => {
      const tr = document.createElement('tr');
      const tdDate = document.createElement('td');
      tdDate.textContent = rec.date || '—';
      const tdDesc = document.createElement('td');
      tdDesc.textContent = rec.description || '';
      const tdAct = document.createElement('td');
      const delBtn = document.createElement('button');
      delBtn.className = 'btn btn-danger';
      delBtn.textContent = 'Padam';
      delBtn.addEventListener('click', () => {
        // inline confirm
        if (delBtn.dataset.confirm === '1') {
          getYearData(currentYear).maintenance.splice(idx, 1);
          debouncedSave();
          refreshTable();
        } else {
          delBtn.textContent = 'Pasti?';
          delBtn.dataset.confirm = '1';
          setTimeout(() => { delBtn.textContent = 'Padam'; delBtn.dataset.confirm = ''; }, 3000);
        }
      });
      tdAct.appendChild(delBtn);
      tr.appendChild(tdDate);
      tr.appendChild(tdDesc);
      tr.appendChild(tdAct);
      tbody.appendChild(tr);
    });
  }
  refreshTable();

  addBtn.addEventListener('click', () => {
    form.classList.toggle('open');
    if (form.classList.contains('open')) dateInp.focus();
  });
  cancelBtn.addEventListener('click', () => {
    form.classList.remove('open');
    dateInp.value = '';
    descInp.value = '';
  });
  saveBtn.addEventListener('click', () => {
    const desc = descInp.value.trim();
    if (!desc) { descInp.focus(); return; }
    getYearData(currentYear).maintenance.push({ date: dateInp.value, description: desc });
    debouncedSave();
    refreshTable();
    form.classList.remove('open');
    dateInp.value = '';
    descInp.value = '';
  });

  return wrap;
}

/* ── Activity log (E3) ── */
function buildActivityLog(yd) {

  hdr.appendChild(addBtn);

  /* Add form */
  const form = document.createElement('div');
  form.className = 'log-form card';
  const formGrid = document.createElement('div');
  formGrid.className = 'log-form-grid';

  function makeField(lbl, id, type, placeholder) {
    const grp = document.createElement('div');
    grp.className = 'field-group';
    const label = document.createElement('label');
    label.textContent = lbl;
    label.htmlFor = id;
    let inp;

      inp.className = 'field-input';

        o.value = lvl;

      });

      inp = document.createElement('input');
      inp.type = type;
      inp.className = 'field-input';
      if (placeholder) inp.placeholder = placeholder;
    }
    inp.id = id;
    grp.appendChild(label);
    grp.appendChild(inp);
    return { grp, inp };

  cancelBtn.className = 'btn btn-secondary';
  cancelBtn.textContent = 'Batal';
  const saveBtn = document.createElement('button');

  saveBtn.textContent = 'Simpan';

  formActions.appendChild(saveBtn);
  form.appendChild(formActions);
  wrap.appendChild(form);

  /* Table */
  const tableWrap = document.createElement('div');
  tableWrap.className = 'card';
  const table = document.createElement('table');
  table.className = 'log-table';
  const thead = document.createElement('thead');
  thead.innerHTML = '<tr><th>Tarikh</th><th>Tajuk</th><th>Peringkat</th><th></th></tr>';
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  tbody.id = 'act-tbody';
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  wrap.appendChild(tableWrap);

  function refreshTable() {
    tbody.innerHTML = '';
    const records = getYearData(currentYear).activities;
    if (records.length === 0) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 4;
      td.className = 'log-empty';
      td.textContent = 'Tiada aktiviti direkodkan lagi.';
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }
    records.forEach((rec, idx) => {
      const tr = document.createElement('tr');
      const tdDate = document.createElement('td');
      tdDate.textContent = rec.date || '—';
      const tdTitle = document.createElement('td');
      tdTitle.textContent = rec.title || '';
      const tdLevel = document.createElement('td');
      const badge = document.createElement('span');
      badge.className = `level-badge level-${rec.level}`;
      badge.textContent = rec.level || '';
      tdLevel.appendChild(badge);
      const tdAct = document.createElement('td');
      const delBtn = document.createElement('button');
      delBtn.className = 'btn btn-danger';
      delBtn.textContent = 'Padam';
      delBtn.addEventListener('click', () => {
        if (delBtn.dataset.confirm === '1') {
          getYearData(currentYear).activities.splice(idx, 1);
          debouncedSave();
          refreshTable();
        } else {
          delBtn.textContent = 'Pasti?';
          delBtn.dataset.confirm = '1';
          setTimeout(() => { delBtn.textContent = 'Padam'; delBtn.dataset.confirm = ''; }, 3000);
        }
      });
      tdAct.appendChild(delBtn);
      tr.appendChild(tdDate);
      tr.appendChild(tdTitle);
      tr.appendChild(tdLevel);
      tr.appendChild(tdAct);
      tbody.appendChild(tr);

  refreshTable();

  addBtn.addEventListener('click', () => {
    form.classList.toggle('open');

  });
  cancelBtn.addEventListener('click', () => {
    form.classList.remove('open');
    dateInp.value = '';
    titleInp.value = '';

    const t = titleInp.value.trim();
    if (!t) { titleInp.focus(); return; }
    getYearData(currentYear).activities.push({ date: dateInp.value, title: t, level: levelSel.value });
    debouncedSave();
    refreshTable();
    form.classList.remove('open');
    dateInp.value = '';
    titleInp.value = '';
  });

  return wrap;

/* ═══════════════════════════════════════════════
   STAR RATING PAGE
═══════════════════════════════════════════════ */
function renderStarRatingPage() {
  const container = document.getElementById('sr-content');
  container.innerHTML = '';

  const yd = getYearData(currentYear);
  const marks = getMarks(currentYear);
  const { overall, stars, elementScores, anyMarked } = computeScore(marks);

  /* ── Score + Stars header ── */
  const headerGrid = document.createElement('div');
  headerGrid.className = 'sr-header';

  const scoreCard = document.createElement('div');
  scoreCard.className = 'score-display';
  const scoreLabel = document.createElement('div');
  scoreLabel.className = 'score-label';
  scoreLabel.textContent = `SKOR KESELURUHAN ${currentYear}`;
  const scoreBig = document.createElement('div');
  scoreBig.className = 'score-big';
  if (!anyMarked) {
    scoreBig.textContent = '—';
  } else {
    const num = document.createElement('span');
    num.textContent = overall;
    const denom = document.createElement('span');
    denom.className = 'score-denom';
    denom.textContent = ' / 100';
    scoreBig.appendChild(num);
    scoreBig.appendChild(denom);
  }
  const scoreMsg = document.createElement('div');
  scoreMsg.className = 'score-msg';
  if (anyMarked) {
    scoreMsg.textContent = nextStarMsg(overall, stars);
  } else {
    scoreMsg.textContent = '0 daripada 17 item sudah dinilai.';
  }
  scoreCard.appendChild(scoreLabel);
  scoreCard.appendChild(scoreBig);
  scoreCard.appendChild(scoreMsg);

  const starsCard = document.createElement('div');
  starsCard.className = 'stars-display';
  const starsLabel = document.createElement('div');
  starsLabel.className = 'stars-label';
  starsLabel.textContent = 'JULAT BINTANG';
  const starsRow = document.createElement('div');
  starsRow.className = 'stars-row';
  starsRow.setAttribute('aria-label', anyMarked ? `${stars} bintang daripada 5` : 'Tiada bintang');
  for (let i = 1; i <= 5; i++) {
    const s = document.createElement('span');
    s.className = 'star-icon ' + (anyMarked && i <= stars ? 'filled' : 'empty');
    s.setAttribute('aria-hidden', 'true');
    s.textContent = '★';
    starsRow.appendChild(s);
  }
  const starsSub = document.createElement('div');
  starsSub.className = 'stars-sub';
  const assessedCount = Object.values(marks).filter(v => v !== null).length;
  starsSub.textContent = `${assessedCount} / 17 item dinilai`;
  starsCard.appendChild(starsLabel);
  starsCard.appendChild(starsRow);
  starsCard.appendChild(starsSub);

  headerGrid.appendChild(scoreCard);
  headerGrid.appendChild(starsCard);
  container.appendChild(headerGrid);

  /* ── Star scale bar ── */
  const scaleWrap = document.createElement('div');
  scaleWrap.className = 'card mb-16';
  const scaleBody = document.createElement('div');
  scaleBody.className = 'card-body';
  const scaleTitle = document.createElement('div');
  scaleTitle.className = 'star-scale-label';
  scaleTitle.textContent = 'Skala 0–100 mengikut bintang';
  scaleBody.appendChild(scaleTitle);

  const track = document.createElement('div');
  track.className = 'star-scale-track';
  track.style.position = 'relative';
  STAR_BANDS.forEach((band, i) => {
    const seg = document.createElement('div');
    seg.className = `star-band star-band-${i+1}`;
    seg.style.width = band.pct + '%';
    seg.setAttribute('title', `${band.label}: ${band.min}–${band.max - 1}`);
    const lbl = document.createElement('span');
    lbl.textContent = band.label;
    seg.appendChild(lbl);
    track.appendChild(seg);
  });
  if (anyMarked && overall !== null) {
    const marker = document.createElement('div');
    marker.className = 'score-marker';
    marker.style.left = Math.min(overall, 100) + '%';
    marker.setAttribute('aria-label', `Skor semasa: ${overall}`);
    track.appendChild(marker);
  }
  scaleBody.appendChild(track);
  const ticks = document.createElement('div');
  ticks.className = 'star-scale-ticks';
  [0, 21, 41, 61, 71, 100].forEach(v => {
    const t = document.createElement('span');
    t.textContent = v;
    ticks.appendChild(t);
  });
  scaleBody.appendChild(ticks);
  scaleWrap.appendChild(scaleBody);
  container.appendChild(scaleWrap);

  /* ── Element summaries ── */
  const elemGrid = document.createElement('div');
  elemGrid.className = 'element-summaries mb-16';
  elementScores.forEach((es, idx) => {
    const el = ELEMENTS[idx];
    const card = document.createElement('div');
    card.className = 'elem-card';
    const nameEl = document.createElement('div');
    nameEl.className = 'elem-card-name';
    nameEl.textContent = es.name;
    const weightEl = document.createElement('div');
    weightEl.className = 'elem-card-weight';
    weightEl.textContent = `${(es.weight * 100).toFixed(0)}% daripada skor`;
    const scoreEl = document.createElement('div');
    scoreEl.className = 'elem-card-score';
    if (!anyMarked) {
      scoreEl.textContent = '—';
    } else {
      scoreEl.textContent = es.pct100.toFixed(0);
      const d = document.createElement('span');
      d.className = 'score-denom';
      d.textContent = ' / 100';
      scoreEl.appendChild(d);
    }
    const barWrap = document.createElement('div');
    barWrap.className = 'elem-bar-wrap';
    barWrap.setAttribute('role', 'img');
    const earnedPct = (es.earned / es.maxPossible) * 100;
    const unassessedPct = (es.unassessed / es.maxPossible) * 100;
    const lostPct = 100 - earnedPct - unassessedPct;
    if (earnedPct > 0) { const b = document.createElement('div'); b.className = 'elem-bar-earned'; b.style.width = earnedPct + '%'; barWrap.appendChild(b); }
    if (unassessedPct > 0) { const b = document.createElement('div'); b.className = 'elem-bar-unassessed'; b.style.width = unassessedPct + '%'; barWrap.appendChild(b); }
    if (lostPct > 0.01) { const b = document.createElement('div'); b.className = 'elem-bar-lost'; b.style.width = lostPct + '%'; barWrap.appendChild(b); }
    const subEl = document.createElement('div');
    subEl.className = 'elem-card-sub';
    const contrib = (es.earned / es.maxPossible * 100 * es.weight).toFixed(1);
    const unassessedContrib = (es.unassessed / es.maxPossible * 100 * es.weight).toFixed(1);
    subEl.textContent = `Sumbang ${contrib} daripada ${(es.weight*100).toFixed(0)} mata · ${unassessedContrib} mata belum dinilai`;
    card.appendChild(nameEl);
    card.appendChild(weightEl);
    card.appendChild(scoreEl);
    card.appendChild(barWrap);
    card.appendChild(subEl);
    elemGrid.appendChild(card);
  });
  container.appendChild(elemGrid);

  /* ── Bottom grid: Top gaps + Evidence status ── */
  const bottomGrid = document.createElement('div');
  bottomGrid.className = 'sr-bottom-grid mb-16';

  /* Top 5 gaps */
  const gapsCard = document.createElement('div');
  gapsCard.className = 'card';
  const gapsBody = document.createElement('div');
  gapsBody.className = 'card-body';
  const gapsTitle = document.createElement('div');
  gapsTitle.className = 'top-gaps-title';
  gapsTitle.textContent = 'Di mana mata masih ada';
  gapsBody.appendChild(gapsTitle);

  const gaps = [];
  ELEMENTS.forEach(el => {
    el.items.forEach(it => {
      const v = marks[it.id];
      const earned = (v === null || v === undefined) ? 0 : Number(v);
      const gap = it.max - earned;
      if (gap > 0) {
        const overallGap = (gap / 100) * el.weight * 100;
        gaps.push({ item: it, element: el, gap, overallGap, isUnassessed: v === null || v === undefined || v === '' });
      }
    });
  });
  gaps.sort((a, b) => b.overallGap - a.overallGap);
  const top5 = gaps.slice(0, 5);

  if (top5.length === 0) {
    const msg = document.createElement('p');
    msg.className = 'text-muted text-sm';
    msg.textContent = 'Semua item sudah mendapat markah penuh!';
    gapsBody.appendChild(msg);
  } else {
    top5.forEach(g => {
      const row = document.createElement('div');
      row.className = 'gap-row';
      const nameWrap = document.createElement('div');
      nameWrap.className = 'gap-item-name';
      const nameLine = document.createElement('div');
      nameLine.textContent = `${g.item.id}. ${g.item.name}`;
      const subLine = document.createElement('div');
      subLine.className = 'gap-item-sub';
      subLine.textContent = (g.isUnassessed ? 'Belum dinilai · ' : '') + `Elemen ${g.element.id.replace('e', '')}`;
      nameWrap.appendChild(nameLine);
      nameWrap.appendChild(subLine);
      const pts = document.createElement('div');
      pts.className = 'gap-points';
      pts.textContent = `+${g.overallGap.toFixed(1)} mata`;
      row.appendChild(nameWrap);
      row.appendChild(pts);
      gapsBody.appendChild(row);
    });
  }
  gapsCard.appendChild(gapsBody);

  /* Evidence status */
  const evCard = document.createElement('div');
  evCard.className = 'card';
  const evBody = document.createElement('div');
  evBody.className = 'card-body';
  const evTitle = document.createElement('div');
  evTitle.className = 'evidence-summary-title';
  evTitle.textContent = 'Status bukti';
  const statusCounts = { 'Ada bukti': 0, 'Separa': 0, 'Tiada': 0, 'Belum semak': 0 };
  ELEMENTS.forEach(el => el.items.forEach(it => {
    const s = yd.items[it.id]?.status || 'Belum semak';
    if (statusCounts[s] !== undefined) statusCounts[s]++;
  }));
  const evBarWrap = document.createElement('div');
  evBarWrap.className = 'elem-bar-wrap';
  evBarWrap.style.height = '20px';
  evBarWrap.style.marginBottom = '12px';
  evBarWrap.setAttribute('role', 'img');
  evBarWrap.setAttribute('aria-label', 'Taburan status bukti');
  const evColors = { 'Ada bukti': '#16a34a', 'Separa': '#ea580c', 'Tiada': '#dc2626', 'Belum semak': '#d1d5db' };
  Object.entries(statusCounts).forEach(([s, cnt]) => {
    if (cnt > 0) {
      const b = document.createElement('div');
      b.style.width = (cnt / 17 * 100) + '%';
      b.style.background = evColors[s];
      b.style.height = '100%';
      evBarWrap.appendChild(b);
    }
  });
  evBody.appendChild(evTitle);
  evBody.appendChild(evBarWrap);
  [
    { key: 'Ada bukti', cls: 'ada', label: 'Ada bukti' },
    { key: 'Tiada', cls: 'tiada', label: 'Tiada' },
    { key: 'Separa', cls: 'separa', label: 'Separa' },
    { key: 'Belum semak', cls: 'belum', label: 'Belum semak' },
  ].forEach(ev => {
    const row = document.createElement('div');
    row.className = 'ev-status-row';
    const dot = document.createElement('span');
    dot.className = 'ev-dot ' + ev.cls;
    dot.setAttribute('aria-hidden', 'true');
    const lbl = document.createElement('span');
    lbl.textContent = ev.label;
    const cnt = document.createElement('span');
    cnt.className = 'ev-count';
    cnt.textContent = statusCounts[ev.key];
    row.appendChild(dot);
    row.appendChild(lbl);
    row.appendChild(cnt);
    evBody.appendChild(row);
  });
  const evNote = document.createElement('div');
  evNote.className = 'ev-note';
  evNote.textContent = 'Status bukti tak mengubah skor. Skor ikut markah yang diisi dalam rubrik.';
  evBody.appendChild(evNote);
  evCard.appendChild(evBody);

  bottomGrid.appendChild(gapsCard);
  bottomGrid.appendChild(evCard);
  container.appendChild(bottomGrid);

  /* ── Full Rubric Table ── */
  ELEMENTS.forEach(el => {
    const section = document.createElement('div');
    section.className = 'rubric-section';
    const header = document.createElement('div');
    header.className = 'rubric-section-header';
    const htitle = document.createElement('span');
    htitle.className = 'rubric-section-title';
    htitle.textContent = el.name;
    const hweight = document.createElement('span');
    hweight.className = 'rubric-section-weight';
    hweight.textContent = `${(el.weight * 100).toFixed(0)}% daripada skor`;
    header.appendChild(htitle);
    header.appendChild(hweight);
    section.appendChild(header);

    el.items.forEach(it => {
      const row = document.createElement('div');
      row.className = 'rubric-item';
      const numEl = document.createElement('div');
      numEl.className = 'rubric-num';
      numEl.textContent = it.id;
      const infoEl = document.createElement('div');
      const nameEl = document.createElement('div');
      nameEl.className = 'rubric-name';
      nameEl.textContent = it.name;
      const maxEl = document.createElement('div');
      maxEl.className = 'rubric-max';
      maxEl.textContent = `Maks: ${it.max} mata`;
      infoEl.appendChild(nameEl);
      infoEl.appendChild(maxEl);

      const inputsEl = document.createElement('div');
      inputsEl.className = 'rubric-inputs';

      const statusWrap = document.createElement('div');
      statusWrap.className = 'mark-input-wrap';
      const statusLabel = document.createElement('label');
      const statusId = `status-sr-${currentYear}-${it.id}`;
      statusLabel.htmlFor = statusId;
      statusLabel.textContent = 'Status bukti';
      const statusSel = document.createElement('select');
      statusSel.id = statusId;
      statusSel.className = 'mark-input';
      statusSel.style.width = '120px';
      ['Belum semak','Ada bukti','Separa','Tiada'].forEach(opt => {
        const o = document.createElement('option');
        o.value = opt;
        o.textContent = opt;
        statusSel.appendChild(o);
      });
      statusSel.value = getYearData(currentYear).items[it.id]?.status || 'Belum semak';
      statusSel.addEventListener('change', () => {
        getYearData(currentYear).items[it.id].status = statusSel.value;
        debouncedSave();
      });
      statusWrap.appendChild(statusLabel);
      statusWrap.appendChild(statusSel);

      const markWrap = document.createElement('div');
      markWrap.className = 'mark-input-wrap';
      const markLabel = document.createElement('label');
      const markId = `mark-sr-${currentYear}-${it.id}`;
      markLabel.htmlFor = markId;
      markLabel.textContent = 'Markah';
      const markInp = document.createElement('input');
      markInp.type = 'number';
      markInp.id = markId;
      markInp.className = 'mark-input';
      markInp.min = '0';
      markInp.max = it.max;
      markInp.step = '0.5';
      markInp.placeholder = '—';
      markInp.setAttribute('aria-label', `Markah untuk ${it.name}`);
      const storedMark = getYearData(currentYear).items[it.id]?.mark;
      if (storedMark !== '' && storedMark !== null && storedMark !== undefined) {
        markInp.value = storedMark;
      }
      markInp.addEventListener('input', () => {
        let v = markInp.value;
        if (v !== '') {
          let n = parseFloat(v);
          if (isNaN(n)) n = 0;
          if (n < 0) n = 0;
          if (n > it.max) n = it.max;
          v = n;
          markInp.value = v;
        }
        getYearData(currentYear).items[it.id].mark = v === '' ? '' : v;
        debouncedSave();
        scheduleScoreRefresh();
      });
      markWrap.appendChild(markLabel);

/* Resize an image File to ≤1000px wide, return JPEG data-URL */
function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const maxW = 1000;
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Uploader name prompt — inline non-blocking form returned as a Promise */

    const box = document.createElement('div');

    nameGrp.className = 'field-group mb-12';
    const nameLbl = document.createElement('label');
    nameLbl.textContent = 'Nama pemuat naik';
    nameLbl.htmlFor = 'uploader-name-inp';
    const nameInp = document.createElement('input');
    nameInp.type = 'text';
    nameInp.id = 'uploader-name-inp';
    nameInp.className = 'field-input';
    nameInp.placeholder = 'Nama anda';

    noteInp.type = 'text';
    noteInp.id = 'uploader-note-inp';
    noteInp.className = 'field-input';
    noteInp.placeholder = 'Keterangan imej';
    noteGrp.appendChild(noteLbl);

    const actions = document.createElement('div');

    const cancelBtn = document.createElement('button');

    cancelBtn.textContent = 'Batal';
    const okBtn = document.createElement('button');
    okBtn.className = 'btn btn-primary';
    okBtn.textContent = 'Muat naik';

    cancelBtn.addEventListener('click', () => { document.body.removeChild(overlay); resolve(null); });
    okBtn.addEventListener('click', () => {
      document.body.removeChild(overlay);
      resolve({ uploader: nameInp.value.trim() || 'Tidak diketahui', note: noteInp.value.trim() });
    });

async function handleImageUpload(fileInput, itemId, thumbStripEl) {
  const files = Array.from(fileInput.files);
  if (!files.length) return;
  fileInput.value = ''; // reset so same file can be re-selected

  const info = await askUploaderInfo();
  if (!info) return; // cancelled

  const now = new Date();
  const dateStr = now.toISOString().slice(0, 10) + ' ' + now.toTimeString().slice(0, 5);

  for (const file of files) {
    let dataUrl;
    try {
      dataUrl = await resizeImage(file);
    } catch(e) {
      // show inline error instead of alert
      const errEl = document.getElementById(`upload-zone-${itemId}`);
      if (errEl) {
        const msg = document.createElement('div');
        msg.style.cssText = 'color:var(--red);font-size:12px;margin-top:4px;';
        msg.textContent = 'Gagal memproses imej: ' + file.name;
        errEl.appendChild(msg);
        setTimeout(() => msg.remove(), 5000);
      }
      continue;
    }

    const imgObj = { id: Date.now() + Math.random(), dataUrl, uploader: info.uploader, note: info.note, date: dateStr, itemId };

    // Try to save
    const yd = getYearData(currentYear);
    if (!yd.items[itemId].images) yd.items[itemId].images = [];

    // Set status to Ada bukti if no status yet
    if (!yd.items[itemId].status || yd.items[itemId].status === 'Belum semak') {
      yd.items[itemId].status = 'Ada bukti';
      // update select on the page if present
      const sel = document.getElementById(`status-ep-${currentYear}-${itemId}`);
      if (sel) sel.value = 'Ada bukti';
    }

    yd.items[itemId].images.push(imgObj);

    try {
      localStorage.setItem(LS_KEY, JSON.stringify(appData));
      showSaveIndicator('Semua perubahan disimpan');
    } catch(e) {
      if (e.name === 'QuotaExceededError' || e.code === 22) {
        // remove the image we just added since it didn't save
        yd.items[itemId].images.pop();
        // Show inline error
        const errEl = document.getElementById(`upload-zone-${itemId}`);
        if (errEl) {
          const msg = document.createElement('div');
          msg.style.cssText = 'color:var(--red);font-size:12px;margin-top:4px;';
          msg.textContent = '⚠ Storan penuh! Imej tidak disimpan. Sila padam imej lama atau eksport data.';
          errEl.appendChild(msg);
          setTimeout(() => msg.remove(), 8000);
        }
        continue;
      } else {
        showSaveIndicator('⚠ Gagal simpan: ' + e.message, true);
      }
    }
  }

  renderThumbs(itemId, thumbStripEl);
}

function renderThumbs(itemId, container) {
  container.innerHTML = '';
  const yd = getYearData(currentYear);
  const images = yd.items[itemId]?.images || [];
  images.forEach(img => {
    const thumb = document.createElement('div');
    thumb.className = 'thumb-item';
    thumb.setAttribute('role', 'button');
    thumb.setAttribute('tabindex', '0');
    thumb.setAttribute('aria-label', `Bukti: ${img.note || img.uploader}`);
    const i = document.createElement('img');
    i.src = img.dataUrl;
    i.alt = img.note || 'Bukti';
    thumb.appendChild(i);
    const open = () => openImageModal(img, itemId, container);
    thumb.addEventListener('click', open);
    thumb.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') open(); });
    container.appendChild(thumb);
  });
}

/* ── Image modal ── */
let modalDeleteHandler = null;

function openImageModal(img, itemId, thumbStripEl) {
  const modal = document.getElementById('img-modal');
  const imgEl = document.getElementById('modal-img');
  const metaItem = document.getElementById('modal-meta-item');
  const metaUploader = document.getElementById('modal-meta-uploader');
  const metaDate = document.getElementById('modal-meta-date');
  const metaNote = document.getElementById('modal-meta-note');
  const deleteBtn = document.getElementById('modal-delete-btn');

  imgEl.src = img.dataUrl;
  imgEl.alt = img.note || 'Bukti';

  // use textContent for meta
  metaItem.textContent = '';
  const itemName = ITEM_MAP[itemId]?.name || `Item ${itemId}`;
  const strong1 = document.createElement('strong');
  strong1.textContent = 'Item: ';
  metaItem.appendChild(strong1);
  metaItem.appendChild(document.createTextNode(itemName));

  metaUploader.textContent = '';
  const strong2 = document.createElement('strong');
  strong2.textContent = 'Dimuat naik oleh: ';
  metaUploader.appendChild(strong2);
  metaUploader.appendChild(document.createTextNode(img.uploader || '—'));

  metaDate.textContent = '';
  const strong3 = document.createElement('strong');
  strong3.textContent = 'Tarikh: ';
  metaDate.appendChild(strong3);
  metaDate.appendChild(document.createTextNode(img.date || '—'));

  metaNote.textContent = '';
  if (img.note) {
    const strong4 = document.createElement('strong');
    strong4.textContent = 'Nota: ';
    metaNote.appendChild(strong4);
    metaNote.appendChild(document.createTextNode(img.note));
  }

  // Remove old delete handler
  if (modalDeleteHandler) deleteBtn.removeEventListener('click', modalDeleteHandler);
  deleteBtn.dataset.confirm = '';
  deleteBtn.textContent = 'Padam imej';

  modalDeleteHandler = () => {
    if (deleteBtn.dataset.confirm === '1') {
      const yd = getYearData(currentYear);
      const arr = yd.items[itemId]?.images || [];
      const idx = arr.findIndex(x => x.id === img.id);
      if (idx !== -1) arr.splice(idx, 1);
      debouncedSave();
      closeImageModal();
      if (thumbStripEl) renderThumbs(itemId, thumbStripEl);
      // refresh galeri if open
      if (currentPage === 'galeri') renderGaleriPage();
    } else {
      deleteBtn.textContent = 'Pasti padam?';
      deleteBtn.dataset.confirm = '1';
      setTimeout(() => { deleteBtn.textContent = 'Padam imej'; deleteBtn.dataset.confirm = ''; }, 3000);
    }
  };
  deleteBtn.addEventListener('click', modalDeleteHandler);

  modal.classList.remove('hidden');
  document.getElementById('modal-close-btn').focus();
}

function closeImageModal() {
  const modal = document.getElementById('img-modal');
  modal.classList.add('hidden');
  document.getElementById('modal-img').src = '';
}

/* ═══════════════════════════════════════════════
   GALERI BUKTI PAGE
═══════════════════════════════════════════════ */
function renderGaleriPage() {
  const container = document.getElementById('galeri-content');
  container.innerHTML = '';

  // Collect all images across all items for current year
  const yd = getYearData(currentYear);
  const allImages = [];
  ELEMENTS.forEach(el => {
    el.items.forEach(it => {
      const images = yd.items[it.id]?.images || [];
      images.forEach(img => {
        allImages.push({ ...img, itemId: it.id, itemName: it.name, elementName: el.name, elementId: el.id });
      });
    });
  });

  // Filter state
  let activeElement = 'all';
  let activeItem = 'all';

  const filtersRow = document.createElement('div');
  filtersRow.className = 'gallery-filters';

  const lbl = document.createElement('span');
  lbl.className = 'gallery-filter-label';
  lbl.textContent = 'Tapis:';
  filtersRow.appendChild(lbl);

  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn active';
  allBtn.textContent = 'Semua';
  allBtn.addEventListener('click', () => { activeElement = 'all'; activeItem = 'all'; renderGrid(); updateFilters(); });
  filtersRow.appendChild(allBtn);

  ELEMENTS.forEach(el => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = `Elemen ${el.id.replace('e','')}`;
    btn.addEventListener('click', () => { activeElement = el.id; activeItem = 'all'; renderGrid(); updateFilters(); });
    btn.dataset.elid = el.id;
    filtersRow.appendChild(btn);
  });

  // Item filter (populated based on element selection)
  const itemFilterRow = document.createElement('div');
  itemFilterRow.className = 'gallery-filters';
  itemFilterRow.id = 'item-filter-row';
  itemFilterRow.style.display = 'none';

  container.appendChild(filtersRow);
  container.appendChild(itemFilterRow);

  function updateFilters() {
    // Update element button states
    filtersRow.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.toggle('active',
        (b.textContent === 'Semua' && activeElement === 'all') ||
        (b.dataset.elid === activeElement)
      );
    });
    // Populate item filters
    itemFilterRow.innerHTML = '';
    if (activeElement !== 'all') {
      itemFilterRow.style.display = 'flex';
      const el = ELEMENTS.find(e => e.id === activeElement);
      const lblI = document.createElement('span');
      lblI.className = 'gallery-filter-label';
      lblI.textContent = 'Item:';
      itemFilterRow.appendChild(lblI);

      const allItemBtn = document.createElement('button');
      allItemBtn.className = 'filter-btn' + (activeItem === 'all' ? ' active' : '');
      allItemBtn.textContent = 'Semua';
      allItemBtn.addEventListener('click', () => { activeItem = 'all'; renderGrid(); updateFilters(); });
      itemFilterRow.appendChild(allItemBtn);

      el.items.forEach(it => {
        const b = document.createElement('button');
        b.className = 'filter-btn' + (activeItem === it.id ? ' active' : '');
        b.textContent = `${it.id}. ${it.name.slice(0, 24)}${it.name.length > 24 ? '…' : ''}`;
        b.addEventListener('click', () => { activeItem = it.id; renderGrid(); updateFilters(); });
        itemFilterRow.appendChild(b);
      });
    } else {
      itemFilterRow.style.display = 'none';
    }
  }

  const gridEl = document.createElement('div');
  gridEl.className = 'gallery-grid';
  gridEl.id = 'galeri-grid';
  container.appendChild(gridEl);

  function renderGrid() {
    gridEl.innerHTML = '';
    const filtered = allImages.filter(img => {
      if (activeElement !== 'all' && img.elementId !== activeElement) return false;
      if (activeItem !== 'all' && img.itemId !== activeItem) return false;
      return true;
    });

    if (filtered.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'gallery-empty';
      empty.style.gridColumn = '1/-1';
      empty.textContent = allImages.length === 0
        ? 'Tiada bukti dimuat naik lagi. Pergi ke halaman elemen untuk muat naik.'
        : 'Tiada bukti untuk penapis yang dipilih.';
      gridEl.appendChild(empty);
      return;
    }

    filtered.forEach(img => {
      const card = document.createElement('div');
      card.className = 'gallery-card';
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', img.itemName + ' – ' + (img.note || img.uploader));

      const imgEl = document.createElement('img');
      imgEl.src = img.dataUrl;
      imgEl.alt = img.note || img.itemName;
      imgEl.loading = 'lazy';

      const meta = document.createElement('div');
      meta.className = 'gallery-card-meta';
      const strong = document.createElement('strong');
      strong.textContent = `${img.itemId}. ${img.itemName}`;
      const uploaderLine = document.createElement('span');
      uploaderLine.textContent = (img.uploader || '—') + ' · ' + (img.date || '—').slice(0, 10);

      meta.appendChild(strong);
      meta.appendChild(document.createElement('br'));
      meta.appendChild(uploaderLine);

      card.appendChild(imgEl);
      card.appendChild(meta);

      // find thumbStrip for this item (may not exist if on gallery page)
      const open = () => openImageModal(img, img.itemId, null);
      card.addEventListener('click', open);
      card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') open(); });
      gridEl.appendChild(card);
    });
  }

  renderGrid();
}

/* Helpers */
function mean(arr) {
  if (!arr.length) return null;
  return arr.reduce((s, v) => s + v, 0) / arr.length;
}
function fmt2(v) { return v === null ? '—' : v.toFixed(2); }
function meanPill(v) {
  if (v === null) return '';
  const cls = v >= 4 ? 'mean-high' : v >= 3 ? 'mean-mid' : 'mean-low';
  return `<span class="mean-pill ${cls}">${v.toFixed(2)}</span>`;
}
function isBlankAnswer(s) {
  if (!s) return true;
